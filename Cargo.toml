[package]
name = "all-smi"
version = "0.25.0"
description = "Command-line utility for monitoring GPU hardware. It provides a real-time view of GPU utilization, memory usage, temperature, power consumption, and other metrics."
authors = ["Jeongkyu Shin <inureyes@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/lablup/all-smi"
readme = "README.md"
keywords = ["cli", "rust"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
chrono = "0.4.44"
crossterm = { version = "0.29.0", optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
dirs = { version = "6", optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
regex = "1.12.2"
sysinfo = "0.39"
anyhow = { version = "1.0.100", optional = true }
hyper = { version = "1.9.0", features = ["full"], optional = true }
hyper-util = { version = "0.1.18", features = ["full"], optional = true }
rand = { version = "0.10", optional = true }
futures-util = "0.3.31"
nvml-wrapper = "0.12.1"
once_cell = "1.21.3"
libc = "0.2"
whoami = "2"
num_cpus = "1.17"
async-trait = "0.1"
thiserror = "2.0"
url = "2.5"
# gRPC for TPU metrics
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# Compression for the `record`/`view --replay` subcommands (issue #187).
# Both are required at the crate level because the writer auto-selects
# by file extension — dynamically gating on a feature would force the
# operator to rebuild to record into a `.gz` stream.
zstd = "0.13"
flate2 = "1"
# Support bundle packaging for the `doctor --bundle` subcommand (issue #188).
tar = "0.4.46"
# Pure-Rust SSH client for the agentless view transport (issue #194).
# Chosen over ssh2/libssh2 so musl static builds do not need a C
# dependency. russh 0.60 targets edition 2021 with tokio 1.x.
russh = "0.62"
[target.'cfg(target_os = "linux")'.dependencies]
# Tenstorrent NPU support via the upstream luwen crates (published on crates.io,
# tracking luwen main). Replaces the former all-smi-luwen-* republished forks.
luwen-api = "0.8.5"
luwen-pci = "0.8.5"
luwen-def = "0.8.5"
# luwen-kmd (the ttkmd-if successor) is pulled in transitively via luwen-pci/luwen-api.
furiosa-smi-rs = { version = "2025.3.0", optional = true }
cgroups-rs = "0.5.0"
# Dynamic library loading for tpu_pjrt
libloading = "0.9"

# AMD GPU support (glibc only, not compatible with musl static linking)
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
# Pinned exactly: this crate has shipped semver-violating breaking changes in
# patch releases (0.11.4 renamed get_all_proc_usage → update_proc_usage, #205).
# 0.11.5 fixes a file-descriptor leak (#218). Re-evaluate the exact version on
# each bump.
#
# Optional and gated behind the default-on `amd` feature (issue #345). It stays
# a hard link, not a `dlopen`, because `libdrm_amdgpu_sys` links `libdrm.so.2`
# and `libdrm_amdgpu.so.1` unconditionally, so every dependent inherits them as
# `NEEDED` entries. Making the dep optional is what lets a downstream crate that
# does not need AMD drop those entries; see the `amd` feature comment below.
libamdgpu_top = { version = "=0.11.5", optional = true }

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"
libloading = "0.9"
# DXGI (true 64-bit VRAM size, adapter LUID / PCI ids) and PDH (GPU
# Engine utilization, per-adapter and per-process dedicated memory) for
# the vendor-neutral Windows GPU metrics layer, issue #346. Version
# pinned to the one `wmi` already resolves, so this promotes an existing
# transitive dependency to a direct one rather than adding a new entry
# to the supply chain.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_Memory",
] }
# Service Control Manager integration for `all-smi service` (issue #311).
# Mullvad's crate, MIT OR Apache-2.0, MSRV 1.71 against this project's
# rust-version = 1.96. Chosen over shelling to sc.exe so failures arrive
# as Win32 error codes we can translate instead of localized text we
# would have to scrape, and over a WinSW/NSSM wrapper so the signed
# release archive still ships a single binary.
windows-service = "0.8.1"
# Rolling file logging for the service context. Under the SCM there is
# no console, so `all-smi service run` writes to
# %PROGRAMDATA%\all-smi\logs instead of stdout.
tracing-appender = "0.2.5"

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.52.3", features = ["full", "test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"

[features]
default = ["cli", "amd"]
cli = ["dep:clap", "dep:crossterm", "dep:axum", "dep:tower-http", "dep:anyhow", "dep:toml", "dep:dirs"]
# AMD GPU backend via `libamdgpu_top`. Default ON, unlike `furiosa` and
# `level_zero`, so every existing distribution path (the glibc release
# binaries, `cargo install all-smi`, the Homebrew formula, a plain
# `cargo build`) keeps AMD support with no packaging change.
#
# The reason it is a feature at all is that `libamdgpu_top` pulls in
# `libdrm_amdgpu_sys`, which links `libdrm.so.2` and `libdrm_amdgpu.so.1`
# unconditionally. Those become hard `NEEDED` entries on every binary that
# depends on this crate, so a host with no AMD GPU (the common case) fails to
# start with a loader error before `main` runs, and cannot degrade gracefully.
# A downstream crate that declares `default-features = false` now stops
# inheriting them. Note that `--no-default-features` also drops `cli`; a
# consumer that wants the CLI but not AMD needs
# `default-features = false, features = ["cli"]`.
#
# Disabling it compiles out `src/device/readers/amd.rs`, the `has_amd`
# detector, and the AMD arm of `reader_factory`, which is the same shape the
# musl release artifacts have always shipped. `all-smi doctor` reports the
# feature-off state distinctly from the musl state via `amd.build.target_env`
# and `amd.libamdgpu_top.abi`. Windows AMD support (`amd_adl` / WMI) is
# unaffected: it never used `libamdgpu_top`.
amd = ["dep:libamdgpu_top"]
mock = ["cli", "dep:rand", "dep:hyper", "dep:hyper-util"]
# Opt-in Furiosa NPU support. Surfaced by the `furiosa.*` doctor checks
# (issue #188) and used by the Linux-target `furiosa-smi-rs` optional dep.
# Note: the bare dep name form (without `dep:` prefix) preserves the
# implicit `furiosa-smi-rs` feature that existing reader code keys on.
furiosa = ["furiosa-smi-rs"]
# Accepted no-op, kept for compatibility.
#
# The Intel Level Zero (oneAPI) Sysman backend it used to gate is now
# compiled into every Linux and Windows build. `build.rs` emits an
# `all_smi_level_zero` cfg for those targets and the code gates on that,
# because cargo cannot express a per-target feature default and we ship a
# single artifact per platform. The backend adds no dependency (the loader
# is `dlopen`d through `libloading`, already an unconditional dependency on
# both targets) and opens nothing on a machine with no Intel GPU, so there
# is no build to opt out of any more.
#
# The consequence worth knowing: the `features:` line of a support bundle
# no longer says anything about this backend. `all-smi doctor` writes a
# separate `level_zero:` line into version.txt, derived from the cfg.
#
# The feature is retained rather than deleted so that
# `--features level_zero`, and any downstream manifest that lists it, keeps
# building. See `src/device/readers/intel_gpu_level_zero.rs` for the module
# and issue #248 for the original rationale.
level_zero = []

[lib]
name = "all_smi"
path = "src/lib.rs"

[[bin]]
name = "all-smi"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "all-smi-mock-server"
path = "src/bin/all-smi-mock-server.rs"
required-features = ["mock"]

[profile.release]
strip = true          # Remove debug symbols
lto = true            # Link-Time Optimization
codegen-units = 1     # Single codegen unit for better optimization
panic = "abort"       # Abort on panic (removes unwind code)
opt-level = "z"       # Optimize for size

[lints.clippy]
# Enable the same lints that CI uses
uninlined_format_args = "warn"
# Other useful lints
needless_return = "warn"
redundant_closure = "warn"
manual_range_contains = "warn"
module_inception = "warn"
bool_comparison = "warn"

[lints.rust]
# Rust compiler lints
unsafe_code = "allow"  # Required for libc calls in process_list.rs
missing_docs = "allow"
