name: Update Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.6.3)'
        required: false

  workflow_run:
    workflows: ["Release"]
    types:
      - completed

# This job reads this repository's releases through `gh api` and writes nothing
# back to it. The only write target anywhere in the run is lablup/homebrew-tap,
# which is reached with HOMEBREW_TAP_TOKEN and not with GITHUB_TOKEN, so read is
# the whole requirement. Declaring it here also drops every other scope to none,
# which is what keeps a compromised step from, say, opening a pull request or
# writing a deployment on the strength of this job's GITHUB_TOKEN.
permissions:
  contents: read

# One formula file, one tap, one branch. Two releases published close together
# otherwise put two runs on the same file: both clone the tap at the same
# commit, both rewrite Formula/all-smi.rb from different tags, and the second
# push is refused as a non-fast-forward. That run ends red having done nothing,
# and the tap keeps whichever tag happened to push first, which is as likely to
# be the older one. Nobody looking at a green release notices. Serializing makes
# the second run clone what the first one pushed, so the tags land in the order
# they were published.
#
# The group is a constant rather than a ref or a tag, because the contended
# resource is the tap and not anything in this repository.
# `cancel-in-progress: false` because a cancelled run can be interrupted between
# `git commit` and `git push`, and there is nothing here that reasons about
# resuming from that.
concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update-homebrew:
    name: Update Homebrew Formula
    runs-on: macos-latest

    # Recorded decision, per issue #316: the `packaging` environment has
    # `protection_rules: []` and `deployment_branch_policy: null`, so naming it
    # here scopes HOMEBREW_TAP_TOKEN to this job but gates nothing. Adding
    # required reviewers or a branch policy is a repository administration
    # change rather than a workflow change, it changes who is able to ship a
    # release, and it is therefore left to a human to decide and apply. It was
    # deliberately not done as part of #316. Until it is, the environment is
    # bookkeeping, and what actually limits the token's reach is below: the tap
    # is cloned anonymously, the credential is supplied to the single `git push`
    # invocation from the environment, and it is never written to disk.
    environment: packaging

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      # `persist-credentials: false` for the same reason the tap clone below
      # carries no credential: by default actions/checkout writes GITHUB_TOKEN
      # into .git/config as an http.extraheader, where it stays readable by
      # every later step and by anything those steps run. No step here performs
      # a git operation in this checkout, so nothing needs it.
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install gnu-sed
        run: brew install gnu-sed

      - name: Determine version tag
        id: get_version
        run: |
          set -euo pipefail

          # The tag is read from the environment, never interpolated into the
          # script. A workflow expression is substituted textually before bash
          # parses the line, and a git tag may legally contain a double quote, a
          # semicolon, a backtick, command substitution and `&&`: whitespace is
          # refused by check-ref-format, but almost no shell metacharacter is.
          # `v1.0.0";id;#` is a valid tag, and interpolated it runs `id` in this
          # job, the job that holds the tap push token in its clone. The
          # workflow_dispatch input is free text and reaches exactly as far.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RELEASE_TAG_INPUT" ]; then
            echo "VERSION=$RELEASE_TAG_INPUT" >> "$GITHUB_ENV"
            exit 0
          fi

          # `releases/latest` is deliberate rather than "the newest tag": it
          # excludes prereleases and drafts, and `brew install` must not hand a
          # user a prerelease. What it cannot do is notice when it has answered
          # a stale question.
          #
          # This job triggers on the Release workflow completing, and the step
          # that promotes a prerelease to a full release lives inside that same
          # workflow. If that promotion does not run, or fails, or the release
          # is a deliberate prerelease, `releases/latest` returns the previous
          # version, the formula already matches it, and the push step exits 0
          # with "nothing to push". A green run that moved nothing.
          #
          # That is not hypothetical: run 32688159260 resolved v0.25.0 while
          # v0.26.0 sat published-as-prerelease, reported success, and left the
          # tap a version behind. The promotion had failed silently, which
          # #388 fixed, but the silence here is its own defect and outlives
          # that one cause.
          #
          # So resolve as before, and then say out loud when a newer release
          # exists that this job is declining to serve. A warning rather than an
          # error: refusing to publish a prerelease to `brew` users is correct
          # behaviour, and only the silence was wrong.
          NEWEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
            --jq '[.[] | select(.draft | not)] | sort_by(.published_at) | (last // {}) | .tag_name // empty')

          if ! TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "::error::${GITHUB_REPOSITORY} has no full release. The tap serves only full releases, and the newest published one is ${NEWEST:-none}."
            exit 1
          fi

          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$TAG" ]; then
            echo "::warning::${NEWEST} is published but is not a full release, so the tap stays at ${TAG}. Promote ${NEWEST} out of prerelease and re-run this workflow to publish it."
          fi

          echo "Resolved ${TAG} (newest published release: ${NEWEST:-none})."
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}

      # Fails here, in two seconds, with a diagnosis. Before this step existed
      # an unusable token surfaced as git's `remote: Invalid username or token`
      # at the very end, after the job had already cloned the tap, downloaded
      # four release assets, rewritten the formula and committed the result.
      # That message names neither the secret nor which of the two places it
      # can be set from, and the v0.26.0 release lost hours to exactly that.
      #
      # It also answers what the git error cannot: whether the token is
      # rejected outright, cannot see the tap at all, or can see it read-only.
      # Those are three different repairs, and git reports all three
      # identically. A local reproduction confirmed that: pushing with a
      # deliberately bogus token through the same credential helper produces
      # byte-identical output to a real expired one, while removing the helper
      # produces a different message. So the git error cannot distinguish a bad
      # value from a bad mechanism either, and this step settles that too.
      #
      # This is the second step the tap token is exposed to, where the note on
      # the push step below says one. A deliberate trade: one more step holding
      # the credential, in exchange for a failure that arrives before anything
      # is mutated and that names what to fix. The token still never reaches
      # argv, a file, or a remote url. `printf` is a bash builtin, so no
      # process on the runner carries it in its command line, and the header
      # goes to curl on stdin for the same reason the push below keeps it out
      # of `-c http.extraheader`.
      - name: Verify the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          # Two places can define this secret and the narrower one wins, which
          # is the failure mode worth naming explicitly rather than leaving a
          # reader to discover: an environment secret on `packaging` shadows an
          # organization secret of the same name. Rotating the organization copy
          # while a stale environment copy exists changes nothing here.
          scopes='the `packaging` environment secret first, then the organization secret of the same name; the environment one wins if both exist'

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN resolved to an empty value. Check ${scopes}."
            exit 1
          fi

          body=$(mktemp)
          code=$(
            printf 'header = "Authorization: Bearer %s"\n' "${HOMEBREW_TAP_TOKEN}" |
            curl --config - \
                 --silent --show-error \
                 --header 'Accept: application/vnd.github+json' \
                 --header 'X-GitHub-Api-Version: 2022-11-28' \
                 --output "$body" \
                 --write-out '%{http_code}' \
                 https://api.github.com/repos/lablup/homebrew-tap
          )

          case "$code" in
            200)
              ;;
            401)
              echo "::error::The tap token was rejected (HTTP 401): expired or revoked. Mint a replacement with Contents:write on lablup/homebrew-tap and set it in ${scopes}."
              exit 1
              ;;
            403)
              echo "::error::The tap token is refused for lablup/homebrew-tap (HTTP 403). Usually SSO authorization or an organization resource restriction rather than the value itself. Check ${scopes}."
              exit 1
              ;;
            404)
              echo "::error::The tap token cannot see lablup/homebrew-tap (HTTP 404). A fine-grained token reports 404 for a repository it was not granted, so this is most likely a token whose repository access does not include the tap. Check ${scopes}."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${code} from the GitHub API while checking the tap token."
              exit 1
              ;;
          esac

          # 200 only proves the token can read a public repository, which any
          # token can. The push is what this job exists to do, so the write bit
          # is the thing to assert.
          if [ "$(jq -r '.permissions.push // false' "$body")" != "true" ]; then
            echo "::error::The tap token can read lablup/homebrew-tap but not write to it. It needs Contents:write. Check ${scopes}."
            exit 1
          fi

          echo "Tap token accepted, with write access to lablup/homebrew-tap."

      - name: Clone Homebrew tap repository
        run: |
          set -euo pipefail

          # Cloned anonymously, on purpose. lablup/homebrew-tap is public, and
          # has to be for `brew tap lablup/tap` to work without credentials, so
          # reading it needs no token at all. This used to clone from
          # `https://x-access-token:<token>@github.com/lablup/homebrew-tap.git`,
          # which git records verbatim as the `origin` url in
          # homebrew-tap/.git/config. The token then sat in the workspace for
          # the rest of the job, readable by every subsequent step and by
          # anything those steps invoke, third-party actions included, and any
          # code execution anywhere in the job was a tap compromise rather than
          # a nuisance. Only the push needs the credential, and the push step
          # takes it from the environment for the length of one command.
          git clone https://github.com/lablup/homebrew-tap.git
          cd homebrew-tap
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

      - name: Download release artifacts and calculate SHA256
        run: |
          set -euo pipefail

          RAW_VERSION="${VERSION}"
          VERSION="${RAW_VERSION#v}"  # Remove leading 'v'

          # VERSION is about to become a download url, a gh api path, a grep
          # pattern and a line in the formula, so it is constrained once here,
          # before any of those see it, rather than at each sink.
          #
          # Refusing `/` is what matters most: curl collapses `/../` in a path,
          # so a version of the form `0.0.0/../../../owner/repo/releases/download/v1`
          # silently retargets BASE at another repository, and both the binary
          # that gets checksummed and the url written into the tap come from
          # there. The version-tagged url guard in the validation step does not
          # catch it, because the retargeted url still contains the version.
          # Refusing `[`, `*` and `\` keeps the version from breaking that same
          # grep, whose `|| true` turns a grep usage error into an empty string
          # and lets the comparison be skipped instead of failing.
          if ! [[ $VERSION =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Refusing to run for tag '${RAW_VERSION}': the version must start with a digit and contain only digits, letters, '.', '+' and '-'."
            exit 1
          fi

          echo "VERSION_NO_V=$VERSION" >> "$GITHUB_ENV"  # Export version without 'v' to GitHub env

          # This repository was renamed from inureyes/all-smi to lablup/all-smi.
          # The old path still resolves through GitHub's rename redirect, but
          # that redirect is not a guarantee: it disappears the moment anyone
          # creates a new repository at the old name. The url written here also
          # lands verbatim in the tap formula, so the redirect was load-bearing
          # for every `brew install all-smi`, not just for this workflow.
          BASE="https://github.com/lablup/all-smi/releases/download/v${VERSION}"

          # Downloads land in RUNNER_TEMP, outside the tap clone. They used to
          # go to homebrew-tap/tmp, which meant four release archives sat inside
          # a git working tree whose next two steps rewrite a tracked file and
          # commit it, and the only thing keeping them out of that commit was
          # the commit step naming Formula/all-smi.rb explicitly. That is one
          # `git add -A` away from publishing binaries into a Homebrew tap, and
          # nothing about the download needs to be there in the first place.
          ARTIFACT_DIR="${RUNNER_TEMP}/all-smi-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          # `-f` so a missing or renamed asset fails here rather than leaving a
          # zero-byte file whose checksum gets committed to the tap, and an
          # archive integrity check so a truncated download cannot turn into a
          # valid-looking sha256 either.
          fetch() {  # name url dest
            local name="$1" url="$2" dest="$3"
            curl -fLs --retry 3 "$url" -o "$dest"
            if [ ! -s "$dest" ]; then
              echo "::error::Empty download: ${url}"
              exit 1
            fi
            case "$dest" in
              *.zip)    unzip -qqt "$dest" > /dev/null ;;
              *.tar.gz) tar -tzf "$dest" > /dev/null ;;
            esac
            {
              echo "${name}_url=${url}"
              echo "${name}_sha=$(shasum -a 256 "$dest" | awk '{print $1}')"
            } >> "$GITHUB_ENV"
          }

          fetch mac       "${BASE}/all-smi-macos-aarch64.zip"    "${ARTIFACT_DIR}/mac.zip"
          fetch linux_arm "${BASE}/all-smi-linux-aarch64.tar.gz" "${ARTIFACT_DIR}/linux-arm.tar.gz"
          fetch linux_x86 "${BASE}/all-smi-linux-x86_64.tar.gz"  "${ARTIFACT_DIR}/linux-x86.tar.gz"

          tar -tzf "${ARTIFACT_DIR}/linux-arm.tar.gz" > "${ARTIFACT_DIR}/linux-arm.contents"
          tar -tzf "${ARTIFACT_DIR}/linux-x86.tar.gz" > "${ARTIFACT_DIR}/linux-x86.contents"
          arm_plugin=false
          x86_plugin=false
          grep -Eq '(^|/)liball_smi_amd\.so$' "${ARTIFACT_DIR}/linux-arm.contents" && arm_plugin=true
          grep -Eq '(^|/)liball_smi_amd\.so$' "${ARTIFACT_DIR}/linux-x86.contents" && x86_plugin=true
          if [ "$arm_plugin" != "$x86_plugin" ]; then
            echo "::error::Linux release archives disagree about AMD plugin presence: arm=${arm_plugin}, x86=${x86_plugin}."
            exit 1
          fi
          echo "amd_plugin_present=${arm_plugin}" >> "$GITHUB_ENV"

          # The Intel Mac zip only exists from the release that first built
          # x86_64-apple-darwin onwards (#306), so its absence is a normal state
          # for older tags rather than an error, and re-running this workflow
          # against one of them has to keep working.
          #
          # Presence is decided from the release's asset list, not from whether a
          # download failed. curl cannot tell "this release never published that
          # asset" apart from "the network dropped", and quietly reading a
          # transient failure as absence is how an artifact stops being published
          # without anyone noticing. The list is fetched into a variable first
          # because a pipeline inside `if` suppresses errexit, which would put
          # that same conflation back in through the API call. Whatever the
          # release does list goes through the same hard-failing `fetch` as
          # everything else, integrity check included. What absence means is
          # decided in the next step, which knows whether the formula still
          # expects an Intel artifact.
          #
          # -x because the release also carries `<asset>.sha256` sidecars, and an
          # unanchored match would accept one of those as the asset itself. -F
          # because the name contains dots, and as a regex those match any
          # character, so an asset named `all-smi-macos-x86_64Xzip` would read as
          # this one being present.
          #
          # The names come from the paginated assets collection, not from the
          # `assets` array that the release object embeds. That array carries no
          # pagination controls and no Link header, so its completeness is not
          # something the API promises, and this workflow reads absence from it
          # as a decision: a truncated list is a silent "the release does not
          # publish an Intel zip", which either skips an artifact that exists or
          # trips the version-skew refusal in the next step. Releases here
          # already publish 18 assets and gain more with every added target, so
          # the safe reading is the one with a documented contract. `--paginate`
          # follows the Link header to the end; `per_page=100` keeps that to a
          # single request at the current asset count.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq '.id')
          if ! [[ $RELEASE_ID =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a numeric release id for v${VERSION}."
            exit 1
          fi
          ASSETS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[].name')
          if printf '%s\n' "$ASSETS" | grep -qxF "all-smi-macos-x86_64.zip"; then
            fetch mac_x86 "${BASE}/all-smi-macos-x86_64.zip" "${ARTIFACT_DIR}/mac-x86.zip"
            echo "mac_x86_present=true" >> "$GITHUB_ENV"
          else
            echo "::notice::v${VERSION} publishes no all-smi-macos-x86_64.zip."
            echo "mac_x86_present=false" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula
        run: |
          cd homebrew-tap
          set -euo pipefail

          VERSION="$VERSION_NO_V"  # Use version without 'v'

          # Stanzas are located by name, never by line offset. This step used to
          # rewrite each checksum with
          #
          #     gsed -i "/ARTIFACT\"/!b;n;c\      sha256 \"...\""
          #
          # which matched the url line, advanced one line, and replaced whatever
          # it landed on. That holds only while sha256 sits directly beneath url
          # inside an on_macos / on_linux block. lablup/mlxcel ran the same
          # construct against a formula whose url had moved to the top level
          # with a `version` stanza in between: it overwrote `version` with the
          # new checksum and left the previous release's sha256 below, so the
          # formula had no version, two sha256 lines, and failed `brew install`
          # on checksum mismatch. It sat broken in the tap for three days
          # (lablup/homebrew-tap 9969ec4). Nothing here depends on layout now,
          # and the guards abort instead of editing the wrong line.

          set_version() {  # file version
            local file="$1" version="$2" n
            n=$(grep -c "^[[:space:]]*version " "$file" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::${file}: expected exactly one version stanza, found ${n}."
              exit 1
            fi
            gsed -i "s|^\([[:space:]]*\)version .*|\1version \"${version}\"|" "$file"
          }

          # Number of url stanzas naming ARTIFACT. Artifact file names are what
          # distinguishes stanzas here, and no two of them are substrings of one
          # another (`all-smi-macos-aarch64.zip` cannot match the x86_64 url, and
          # vice versa), so one macOS block per architecture addresses cleanly.
          # Zero is a real state, not only an error: the formula lives in another
          # repository and gains a stanza in a separate manual commit, so a new
          # artifact exists here for a while before the tap has anywhere to put
          # it. set_artifact still refuses anything but exactly one.
          count_artifact() {  # file artifact
            awk -v a="$2" '$0 ~ /^[[:space:]]*url / && index($0, a) { c++ } END { print c+0 }' "$1"
          }

          # Rewrites the url stanza whose value contains ARTIFACT, then the
          # first sha256 stanza below it, preserving each line's indentation.
          set_artifact() {  # file artifact url sha
            local file="$1" artifact="$2" url="$3" sha="$4" n
            n=$(count_artifact "$file" "$artifact")
            if [ "$n" -ne 1 ]; then
              echo "::error::${file}: expected exactly one url stanza for ${artifact}, found ${n}."
              exit 1
            fi
            awk -v a="$artifact" -v u="$url" -v s="$sha" '
              !seen && $0 ~ /^[[:space:]]*url / && index($0, a) {
                match($0, /^[[:space:]]*/)
                printf "%surl \"%s\"\n", substr($0, 1, RLENGTH), u
                seen = 1
                next
              }
              seen && !hit && $0 ~ /^[[:space:]]*sha256 / {
                match($0, /^[[:space:]]*/)
                printf "%ssha256 \"%s\"\n", substr($0, 1, RLENGTH), s
                hit = 1
                next
              }
              { print }
              END { exit(hit ? 0 : 1) }
            ' "$file" > "${file}.new" || {
              echo "::error::${file}: no sha256 stanza follows the url for ${artifact}."
              rm -f "${file}.new"
              exit 1
            }
            mv "${file}.new" "$file"
          }

          sync_amd_plugin_install() {  # file present
            local file="$1" n
            n=$(grep -cF '(lib/"all-smi").install "liball_smi_amd.so" if OS.linux?' "$file" || true)
            if [ "$n" -gt 1 ]; then
              echo "::error::${file}: AMD plugin install line appears ${n} times."
              exit 1
            fi
            if [ "$2" != "true" ]; then
              if [ "$n" -eq 1 ]; then
                gsed -i '\|(lib/"all-smi").install "liball_smi_amd.so" if OS.linux?|d' "$file"
              fi
              return
            fi
            if [ "$n" -eq 1 ]; then
              return
            fi
            awk '
              { print }
              !inserted && /^[[:space:]]*bin\.install "all-smi"$/ {
                print "    (lib/\"all-smi\").install \"liball_smi_amd.so\" if OS.linux?"
                inserted = 1
              }
              END { exit(inserted ? 0 : 1) }
            ' "$file" > "${file}.new" || {
              echo "::error::${file}: could not locate bin.install \"all-smi\" to add the AMD plugin."
              rm -f "${file}.new"
              exit 1
            }
            mv "${file}.new" "$file"
          }

          set_version  Formula/all-smi.rb "$VERSION"
          set_artifact Formula/all-smi.rb all-smi-macos-aarch64.zip    "$mac_url"       "$mac_sha"
          set_artifact Formula/all-smi.rb all-smi-linux-aarch64.tar.gz "$linux_arm_url" "$linux_arm_sha"
          set_artifact Formula/all-smi.rb all-smi-linux-x86_64.tar.gz  "$linux_x86_url" "$linux_x86_sha"
          sync_amd_plugin_install Formula/all-smi.rb "${amd_plugin_present:-false}"

          # The Intel Mac artifact and the formula stanza that serves it arrive
          # independently: the asset appears in the first release built for
          # x86_64-apple-darwin, the stanza in a hand-written commit to
          # lablup/homebrew-tap. All four combinations occur, and each one is
          # answered here rather than left to whatever the rewrite happens to do.
          #
          #   asset yes, stanza yes  update it, like any other artifact.
          #   asset no,  stanza no   nothing to do. This is every release up to
          #                          v0.25.0, and re-running against those tags
          #                          has to stay a no-op.
          #   asset yes, stanza no   update the rest and push, then end the job
          #                          red in a later step. Failing here instead
          #                          would hold the other three artifacts back
          #                          over a tap that is merely incomplete, and a
          #                          warning alone would leave Intel users
          #                          unserved for as long as nobody reads the
          #                          logs.
          #   asset no,  stanza yes  refuse, before anything is pushed. Skipping
          #                          would bump `version` while the Intel url
          #                          still points at an older release: `brew
          #                          install` then hands an Intel user a binary
          #                          of a different version than the formula
          #                          claims, and it passes `ruby -c` and `brew
          #                          style` on the way out. Either the release
          #                          lost an artifact it used to publish or the
          #                          tag predates it; both want a human.
          INTEL_MAC=all-smi-macos-x86_64.zip
          stanzas=$(count_artifact Formula/all-smi.rb "$INTEL_MAC")

          if [ "${mac_x86_present:-false}" != "true" ]; then
            if [ "$stanzas" -ne 0 ]; then
              echo "::error::Formula/all-smi.rb: the formula has an ${INTEL_MAC} stanza but v${VERSION} does not publish that asset. Refusing to bump the version while the Intel url still points at another release."
              exit 1
            fi
            echo "::notice::v${VERSION} publishes no ${INTEL_MAC} and the formula has no stanza for it; the macOS section is left as is."
            echo "mac_x86_state=skipped" >> "$GITHUB_ENV"
          elif [ "$stanzas" -eq 0 ]; then
            echo "::warning::v${VERSION} publishes ${INTEL_MAC} but Formula/all-smi.rb has no stanza for it, so Intel Macs are still served nothing. The other artifacts are updated and pushed; this job then fails on purpose."
            echo "mac_x86_state=stanza-missing" >> "$GITHUB_ENV"
          else
            set_artifact Formula/all-smi.rb "$INTEL_MAC" "$mac_x86_url" "$mac_x86_sha"
            echo "mac_x86_state=updated" >> "$GITHUB_ENV"
          fi

      - name: Validate updated formula
        run: |
          cd homebrew-tap
          set -euo pipefail

          VERSION="$VERSION_NO_V"

          echo "=== Formula/all-smi.rb ==="
          cat Formula/all-smi.rb

          # `brew style` is the check the tap itself is expected to pass, and it
          # only applies formula cops to paths under Formula/. `ruby -c` is not
          # sufficient on its own: the mlxcel corruption described above was
          # valid Ruby and would have passed a syntax check.
          ruby -c Formula/all-smi.rb
          brew style Formula/all-smi.rb

          if ! grep -q "^[[:space:]]*version \"${VERSION}\"$" Formula/all-smi.rb; then
            echo "::error::Formula/all-smi.rb: version stanza is not ${VERSION}."
            exit 1
          fi

          plugin_installs=$(grep -cF '(lib/"all-smi").install "liball_smi_amd.so" if OS.linux?' Formula/all-smi.rb || true)
          expected_plugin_installs=0
          if [ "${amd_plugin_present:-false}" = "true" ]; then
            expected_plugin_installs=1
          fi
          if [ "$plugin_installs" -ne "$expected_plugin_installs" ]; then
            echo "::error::Formula/all-smi.rb: expected ${expected_plugin_installs} Linux AMD plugin install line(s), found ${plugin_installs}."
            exit 1
          fi

          # The expected artifacts, as the (url, sha256) pairs they have to form
          # in the formula. The count comes from the list the previous step
          # actually wrote rather than from a literal: the Intel macOS stanza is
          # optional, so a fixed number is wrong in one of the two states, and a
          # literal is the kind that quietly goes stale the next time an
          # artifact is added.
          expected_urls=("$mac_url" "$linux_arm_url" "$linux_x86_url")
          expected_shas=("$mac_sha" "$linux_arm_sha" "$linux_x86_sha")
          if [ "${mac_x86_state:-skipped}" = "updated" ]; then
            expected_urls+=("$mac_x86_url")
            expected_shas+=("$mac_x86_sha")
          fi

          # A substitution that silently no-ops would leave the previous
          # release's checksum behind, so require the exact expected count.
          # Counted over sha256 stanzas rather than over pairs, so a checksum
          # with no url above it is caught too.
          n=$(grep -c "^[[:space:]]*sha256 " Formula/all-smi.rb || true)
          if [ "$n" -ne "${#expected_shas[@]}" ]; then
            echo "::error::Formula/all-smi.rb: expected ${#expected_shas[@]} sha256 stanzas, found ${n}."
            exit 1
          fi

          # url and checksum are then checked together, as the pair `brew
          # install` will act on. Checking them independently, which is what this
          # used to do, accepts a formula in which two artifacts have exchanged
          # checksums: every expected checksum is present, every url names the
          # right release, and each stanza describes a file that exists. Swapped
          # is not a hypothetical shape either, it is precisely what a rewrite
          # that matched one stanza and wrote into another produces, which is the
          # failure mode the whole update step is built around avoiding. The
          # result installs a Linux tarball whose sha256 is a macOS zip's, so it
          # fails at the checksum for a reason that says nothing about the cause.
          #
          # Pairs are read out of the file the same way set_artifact writes
          # them: a url stanza, then the first sha256 stanza below it. A url
          # with no sha256 beneath it yields no pair, so the count comes up
          # short and the comparison below rejects the file.
          TAB=$'\t'
          pairs="${RUNNER_TEMP}/formula-url-sha-pairs.txt"
          awk '
            /^[[:space:]]*url "/ {
              u = $0
              sub(/^[[:space:]]*url "/, "", u)
              sub(/".*$/, "", u)
              pending = 1
              next
            }
            pending && /^[[:space:]]*sha256 "/ {
              s = $0
              sub(/^[[:space:]]*sha256 "/, "", s)
              sub(/".*$/, "", s)
              printf "%s\t%s\n", u, s
              pending = 0
            }
          ' Formula/all-smi.rb > "$pairs"

          found=$(wc -l < "$pairs" | tr -d '[:space:]')
          if [ "$found" -ne "${#expected_urls[@]}" ]; then
            echo "::error::Formula/all-smi.rb: expected ${#expected_urls[@]} url/sha256 pairs, found ${found}."
            exit 1
          fi

          i=0
          while [ "$i" -lt "${#expected_urls[@]}" ]; do
            if ! grep -qxF "${expected_urls[$i]}${TAB}${expected_shas[$i]}" "$pairs"; then
              echo "::error::Formula/all-smi.rb: no url stanza for ${expected_urls[$i]} is followed by sha256 ${expected_shas[$i]}."
              exit 1
            fi
            i=$((i + 1))
          done

          # Every release download has to name this release, whatever the
          # checksums say. A stanza the update step declined to touch keeps its
          # old url, and a formula whose version and urls disagree installs a
          # binary of the wrong version through checksums that all verify. Same
          # class of failure as the mlxcel corruption, caught from the other end.
          # Scoped to releases/download urls so a url that is not a release asset
          # is not read as a version mismatch.
          #
          # The version is part of a regex here, so its dots are escaped:
          # unescaped they match any character, and a url left behind at
          # `v0X25X0` would be counted as pointing at v0.25.0.
          version_re="${VERSION//./\\.}"
          urls=$(grep -c "^[[:space:]]*url \".*/releases/download/" Formula/all-smi.rb || true)
          tagged=$(grep -c "^[[:space:]]*url \".*/releases/download/v${version_re}/" Formula/all-smi.rb || true)
          if [ "$urls" -ne "$tagged" ]; then
            echo "::error::Formula/all-smi.rb: ${urls} release urls but only ${tagged} point at v${VERSION}."
            exit 1
          fi

      - name: Commit and push changes to tap
        env:
          # The only step in the job that the tap token is exposed to, and the
          # only one that needs it. Every step above reads public data.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          set -euo pipefail

          git add Formula/all-smi.rb

          # Re-running the workflow for a version already in the tap is not an
          # error; `git commit` would fail on an empty index otherwise.
          if git diff --cached --quiet; then
            echo "Formula already up to date for v${VERSION_NO_V}, nothing to push."
            exit 0
          fi

          git commit -m "bump: all-smi to v${VERSION_NO_V}"

          # The credential exists for the duration of this one command, and in
          # only one place: this process's environment.
          #
          # Not in the remote url, which is where it used to live. `git clone
          # https://x-access-token:<token>@...` records the url in .git/config,
          # so the token outlives the command that used it and is readable by
          # everything that runs afterwards in the job.
          #
          # Not in argv either, which rules out the usual replacement,
          # `-c http.extraheader="Authorization: Basic $(...)"`. Command lines
          # are readable through `ps` for as long as the process runs, and any
          # step that later turns on `set -x` prints the expanded line into the
          # workflow log. What is written below survives both: the helper string
          # sits inside single quotes, so bash hands git the name
          # `$HOMEBREW_TAP_TOKEN` and expands nothing, and a trace of this line
          # shows that same name. Only the shell that git spawns to run the
          # helper resolves it, from its inherited environment, and xtrace does
          # not reach that shell.
          #
          # The empty `-c credential.helper=` first is not redundant. An empty
          # value resets the helper list, which drops whatever the runner image
          # configures globally, osxkeychain on macOS among them. Without it a
          # successful authentication is handed to that helper for storage, and
          # the token lands in the keychain, which is disk. The helper below
          # answers `get` and nothing else, so git's post-authentication `store`
          # call is a no-op, and the `if` makes it exit 0 so git does not treat
          # the silence as a failed helper.
          #
          # SC2016 is the point, not an oversight: the single quotes are what
          # keep bash from expanding the variable, so only the helper's own
          # shell ever sees the value.
          # shellcheck disable=SC2016
          git \
            -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$HOMEBREW_TAP_TOKEN"; fi; }; f' \
            push origin main

      # Deliberately last, and deliberately red. The release publishes an Intel
      # Mac artifact that the formula has no stanza for, so the three artifacts
      # it does describe were updated and pushed above and Intel users got
      # nothing. Failing earlier would have withheld a correct update from every
      # other platform; a warning would have been true, printed, and forgotten.
      # Ending the job red leaves the tap current, the gap on the run summary,
      # and the fix a two-line edit to lablup/homebrew-tap Formula/all-smi.rb
      # (an `if Hardware::CPU.intel?` block inside `on_macos`, mirroring the one
      # `on_linux` already has) plus a workflow_dispatch re-run for the same tag,
      # which is a no-op for everything already committed.
      - name: Report unpublished Intel macOS artifact
        if: env.mac_x86_state == 'stanza-missing'
        run: |
          echo "::error::v${VERSION_NO_V} publishes all-smi-macos-x86_64.zip but lablup/homebrew-tap Formula/all-smi.rb has no url stanza for it, so Intel Macs still install nothing. Add an 'if Hardware::CPU.intel?' block inside on_macos with that url and its sha256, then re-run this workflow for the same tag."
          exit 1
