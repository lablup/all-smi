name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'screenshots/**'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'screenshots/**'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python -m pytest scripts/tests/test_doc_links.py
      - run: python scripts/check-doc-links.py
