name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "31.1"  # or "32.0-rc-2" etc.

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install AMD GPU development libraries
      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      # protoc: cached install via composite action
      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # ═══════════════════════════════════════════════════════════════
  # Job: Packaging Sync (issue #309)
  # ═══════════════════════════════════════════════════════════════
  # packaging/systemd/ holds the canonical unit and environment file.
  # debian/ carries byte-identical copies because the Launchpad job
  # overlays only debian/ onto a release-tag checkout, and the unit has
  # to sit at debian/all-smi.service for dh_installsystemd to find it.
  # Two sources of truth drift, so assert they never do. No toolchain
  # needed, so this fails within seconds of a mismatch.
  # ───────────────────────────────────────────────────────────────
  packaging-sync:
    name: Packaging Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: debian/ copies must match packaging/systemd/
        run: |
          set -eu
          fail=0
          for pair in "all-smi.service" "all-smi.default"; do
            if ! diff -u "packaging/systemd/${pair}" "debian/${pair}"; then
              echo "::error file=debian/${pair}::debian/${pair} has drifted from packaging/systemd/${pair}; copy the canonical file over it"
              fail=1
            fi
          done
          exit "$fail"

  # ═══════════════════════════════════════════════════════════════
  # Job: systemd service lifecycle smoke test (issue #309)
  # ═══════════════════════════════════════════════════════════════
  # Exercises `all-smi service` end to end against a real systemd.
  # Prefers the user scope because it needs no root; GitHub's hosted
  # runners usually have no user manager, so the system scope is the
  # fallback and covers the same lifecycle plus /etc/all-smi/config.toml
  # discovery.
  # ───────────────────────────────────────────────────────────────
  systemd-service:
    name: systemd Service Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all-smi
        run: cargo build --bin all-smi

      - name: Probe for a user systemd instance
        id: probe
        run: |
          if systemctl --user show-environment >/dev/null 2>&1; then
            echo "user_scope=true" >> "$GITHUB_OUTPUT"
          else
            echo "user_scope=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no user systemd instance on this runner; falling back to the system-scope flow"
          fi

      # ── User scope: install, start, restart, stop, uninstall ──
      #
      # The ERR trap is not scaffolding: a unit that a per-user manager
      # cannot apply dies before ExecStart, and `systemctl --user start`
      # reports only "control process exited with error code". Without
      # the journal and the rendered unit in the log, that failure is
      # undebuggable from CI output alone. Keep the trap.
      - name: User-scope lifecycle
        if: steps.probe.outputs.user_scope == 'true'
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          UNIT="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/all-smi.service"

          diagnose() {
            set +x
            echo "::group::diagnostics: user-scope all-smi.service"
            echo "--- rendered unit ($UNIT) ---"
            cat "$UNIT" 2>&1 || true
            echo "--- systemctl --user status ---"
            systemctl --user status all-smi.service --no-pager -l 2>&1 || true
            echo "--- systemctl --user show (failure detail) ---"
            systemctl --user show all-smi.service \
              -p LoadState -p ActiveState -p SubState -p Result \
              -p ExecMainCode -p ExecMainStatus -p StatusErrno -p InvocationID 2>&1 || true
            echo "--- journalctl --user ---"
            journalctl --user -xeu all-smi.service --no-pager -n 200 2>&1 || true
            echo "--- host namespace policy (the usual cause) ---"
            sysctl user.max_user_namespaces 2>&1 || true
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3  # not installed yet

          "$BIN" service install --user
          test -f "$UNIT"
          head -1 "$UNIT" | grep -qF "# Managed by 'all-smi service'"
          grep -q "^WantedBy=default.target$" "$UNIT"

          # Every directive a per-user manager cannot apply must be
          # absent. Each of these makes the unit fail before ExecStart,
          # which is exactly the class of bug this job exists to catch.
          for forbidden in \
              "User=" "Group=" "SupplementaryGroups=" "ProtectKernelModules=" \
              "ProtectSystem=" "ProtectHome=" "PrivateTmp=" "ProtectControlGroups="; do
            if grep -q "^${forbidden}" "$UNIT"; then
              echo "::error::user-scope unit contains ${forbidden}, which a per-user systemd manager cannot apply"
              diagnose
              exit 1
            fi
          done
          # ...and the privilege-free hardening must survive.
          grep -q "^NoNewPrivileges=true$" "$UNIT"
          grep -q "^RestrictSUIDSGID=true$" "$UNIT"

          # systemd's own parser is the authority on whether the rendered
          # unit is valid. Also covers the issue's `systemd-analyze
          # verify` acceptance criterion.
          systemd-analyze --user verify "$UNIT"

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3  # installed, not started
          "$BIN" service status --user --json | grep -q '"installed": true'

          "$BIN" service start --user
          for _ in $(seq 1 30); do
            "$BIN" service status --user && break || sleep 1
          done
          "$BIN" service status --user

          "$BIN" service restart --user
          "$BIN" service stop --user
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

          "$BIN" service uninstall --user
          test ! -f "$UNIT"

          # `--now` is a distinct code path (`systemctl enable --now`
          # rather than `enable` followed by `start`), so exercise it
          # rather than inferring it from the two halves above.
          "$BIN" service install --user --now
          for _ in $(seq 1 30); do
            "$BIN" service status --user && break || sleep 1
          done
          "$BIN" service status --user
          "$BIN" service status --user --json | grep -q '"running": true'

          "$BIN" service uninstall --user
          test ! -f "$UNIT"
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

      # ── System scope fallback: same lifecycle under sudo ──
      - name: System-scope lifecycle
        if: steps.probe.outputs.user_scope != 'true'
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          UNIT=/etc/systemd/system/all-smi.service

          # Same rationale as the user-scope trap: a unit that fails
          # before ExecStart produces an opaque error, so always dump the
          # journal and the rendered unit. Keep this permanently.
          diagnose() {
            set +x
            echo "::group::diagnostics: system-scope all-smi.service"
            echo "--- rendered unit ($UNIT) ---"
            sudo cat "$UNIT" 2>&1 || true
            echo "--- systemctl status ---"
            sudo systemctl status all-smi.service --no-pager -l 2>&1 || true
            echo "--- systemctl show (failure detail) ---"
            sudo systemctl show all-smi.service \
              -p LoadState -p ActiveState -p SubState -p Result \
              -p ExecMainCode -p ExecMainStatus -p StatusErrno -p InvocationID 2>&1 || true
            echo "--- journalctl ---"
            sudo journalctl -xeu all-smi.service --no-pager -n 200 2>&1 || true
            echo "--- effective configuration ---"
            sudo cat /etc/all-smi/config.toml 2>&1 || true
            sudo cat /etc/default/all-smi 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          # Unprivileged mutation must be refused with the documented message.
          "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service install 2>&1 | grep -q "requires root"

          # /etc/all-smi/config.toml must be honoured by the daemon, which
          # runs as root with no reachable home directory.
          sudo install -d -m 0755 /etc/all-smi
          printf '[api]\nport = 19191\n' | sudo tee /etc/all-smi/config.toml >/dev/null
          printf 'RUST_LOG=info\n' | sudo tee /etc/default/all-smi >/dev/null

          sudo "$BIN" service install --now
          sudo test -f "$UNIT"
          sudo head -1 "$UNIT" | grep -qF "# Managed by 'all-smi service'"
          # ExecStart must point at the binary that ran the install, not
          # at the packaged /usr/bin path. Matched loosely because
          # current_exe() canonicalizes and the runner workspace may sit
          # behind a symlink.
          sudo grep -q "^ExecStart=.*target/debug/all-smi api$" "$UNIT"
          sudo grep -q "^WantedBy=multi-user.target$" "$UNIT"
          # A system manager runs as root and can apply the full
          # hardening set, so unlike user scope none of it is dropped.
          for required in \
              "NoNewPrivileges=true" "ProtectSystem=strict" "ProtectHome=true" \
              "PrivateTmp=true" "ProtectKernelModules=true" \
              "ProtectControlGroups=true" "RestrictSUIDSGID=true"; do
            sudo grep -q "^${required}$" "$UNIT" || {
              echo "::error::system-scope unit lost hardening directive ${required}"
              diagnose
              exit 1
            }
          done
          # systemd's own parser is the authority. Also covers the
          # issue's `systemd-analyze verify` acceptance criterion.
          sudo systemd-analyze verify "$UNIT"
          systemctl is-enabled all-smi

          for _ in $(seq 1 30); do
            if systemctl is-active --quiet all-smi; then break; fi
            sleep 1
          done
          systemctl is-active --quiet all-smi || {
            diagnose
            exit 1
          }

          sudo "$BIN" service status
          sudo "$BIN" service status --json | grep -q '"running": true'
          curl -sf --max-time 10 http://127.0.0.1:19191/metrics | head -5

          # Crash recovery: systemd must bring it back within RestartSec.
          MAINPID=$(systemctl show all-smi -p MainPID --value)
          sudo kill -9 "$MAINPID"
          for _ in $(seq 1 40); do
            NEWPID=$(systemctl show all-smi -p MainPID --value)
            if systemctl is-active --quiet all-smi && [ "$NEWPID" != "$MAINPID" ] && [ "$NEWPID" != "0" ]; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet all-smi || {
            echo "::error::service did not come back after kill -9 within RestartSec"
            diagnose
            exit 1
          }

          sudo "$BIN" service restart
          sudo "$BIN" service stop
          sudo "$BIN" service status && rc=0 || rc=$?
          test "$rc" -eq 3

          sudo "$BIN" service uninstall
          sudo test ! -f "$UNIT"
          sudo rm -f /etc/all-smi/config.toml /etc/default/all-smi

      - name: Refuse to clobber a foreign unit
        run: |
          set -eux
          BIN="$PWD/target/debug/all-smi"
          UNIT=/etc/systemd/system/all-smi.service
          printf '[Unit]\nDescription=hand written\n' | sudo tee "$UNIT" >/dev/null

          sudo "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          sudo "$BIN" service install 2>&1 | grep -q "Managed by 'all-smi service'"

          # --force lifts the refusal, then clean up after ourselves.
          sudo "$BIN" service install --force
          sudo "$BIN" service uninstall
          sudo rm -f "$UNIT"
          sudo systemctl daemon-reload

  # ═══════════════════════════════════════════════════════════════
  # Job: launchd service smoke test (issue #310)
  # ═══════════════════════════════════════════════════════════════
  # Runs on Apple Silicon so the native readers (IOReport, SMC,
  # thermalState) are actually exercised from a launchd context, not
  # just the plist renderer.
  #
  # Split into two tiers because a hosted runner may have no
  # bootstrappable GUI domain:
  #
  #  1. Render tier. `install --user` without `--now` writes the plist
  #     and touches launchd not at all, so plist validity, the managed
  #     marker, the user-scope key drops, and both refusal paths are
  #     checkable anywhere. Always runs.
  #  2. Lifecycle tier. Gated on `launchctl print gui/$UID` succeeding.
  #     Skips with a notice rather than failing where the domain is
  #     absent.
  #
  # The system domain is deliberately never touched: no
  # /Library/LaunchDaemons, no `sudo launchctl bootstrap system`.
  # ───────────────────────────────────────────────────────────────
  launchd-service:
    name: launchd Service Smoke Test
    runs-on: macos-14
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: osx-aarch_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all-smi
        run: cargo build --bin all-smi

      - name: Probe for a bootstrappable GUI domain
        id: probe
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "gui_domain=true" >> "$GITHUB_OUTPUT"
          else
            echo "gui_domain=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no gui/\$UID domain on this runner; running the render tier only"
          fi

      # ── Render tier: no launchd domain required ──
      #
      # launchd accepts a LaunchAgent carrying UserName/GroupName and
      # silently ignores them, so a regression that leaves those keys in
      # a user-scope plist cannot be caught by bootstrapping it. It has
      # to be caught here, on the rendered file.
      - name: Rendered plist is valid and correctly scoped
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"

          diagnose() {
            set +x
            echo "::group::diagnostics: rendered LaunchAgent plist"
            echo "--- $PLIST ---"
            cat "$PLIST" 2>&1 || echo "(absent)"
            echo "--- plutil ---"
            plutil -lint "$PLIST" 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

          "$BIN" service install --user
          test -f "$PLIST"

          # launchd parses this with CFPropertyList; a stray `--` inside
          # the marker comment would make the whole job unloadable.
          plutil -lint "$PLIST"
          grep -qF "<!-- Managed by 'all-smi service' -->" "$PLIST"
          grep -qF "<string>api</string>" "$PLIST"
          grep -qF "$HOME/Library/Logs/all-smi/all-smi.log" "$PLIST"

          # Keys a gui/$UID domain cannot honour must be absent.
          for key in UserName GroupName InitGroups; do
            if grep -qF "<key>${key}</key>" "$PLIST"; then
              echo "::error::${key} must not survive into a user-scope plist"
              exit 1
            fi
          done

          # Installed but not bootstrapped is the documented state here.
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3
          "$BIN" service status --user --json | grep -q '"installed": true'

          "$BIN" service uninstall --user
          test ! -f "$PLIST"

      - name: Refuse an unelevated system install and a foreign plist
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"

          # System scope must refuse before writing anything at all.
          "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service install 2>&1 | grep -q "requires root"
          test ! -f /Library/LaunchDaemons/com.lablup.all-smi.plist

          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0"><dict><key>Label</key><string>hand written</string></dict></plist>' \
            > "$PLIST"
          "$BIN" service install --user && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service uninstall --user && rc=0 || rc=$?
          test "$rc" -eq 1
          grep -q "hand written" "$PLIST"

          "$BIN" service uninstall --user --force
          test ! -f "$PLIST"

      # ── Lifecycle tier: needs a real gui/$UID domain ──
      - name: User-scope lifecycle
        if: steps.probe.outputs.gui_domain == 'true'
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"
          LOG="$HOME/Library/Logs/all-smi/all-smi.log"
          TARGET="gui/$(id -u)/com.lablup.all-smi"

          # A job that fails to spawn under launchd reports almost
          # nothing through the exit code alone, so dump the three
          # places the reason can be before giving up.
          diagnose() {
            set +x
            echo "::group::diagnostics: launchd user-scope service"
            echo "--- $PLIST ---"
            cat "$PLIST" 2>&1 || echo "(absent)"
            echo "--- launchctl print $TARGET ---"
            launchctl print "$TARGET" 2>&1 || true
            echo "--- launchctl print-disabled gui/$(id -u) ---"
            launchctl print-disabled "gui/$(id -u)" 2>&1 | grep -i all-smi || true
            echo "--- $LOG ---"
            cat "$LOG" 2>&1 || echo "(absent)"
            echo "--- service status ---"
            "$BIN" service status --user 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          # Every readiness wait polls for a rendered metric line, which
          # is the same condition the assertions downstream require.
          #
          # Two weaker gates were tried and both race. `service status`
          # reports running the moment launchd spawns the program, long
          # before it has come up. Plain HTTP 200 is not much better:
          # axum binds the listener and starts serving `/metrics` while
          # the background collection loop has not yet written anything
          # into AppState, and an empty AppState renders a byte-empty
          # body by design (`empty_inputs_render_empty_string` in
          # src/api/metrics/render.rs). So the endpoint answers 200 with
          # zero bytes for a while. Measured on an M1 Ultra: about 0.3 s
          # at normal priority, and 2.1 to 3.5 s under the background QoS
          # this service's ProcessType=Background selects. Run
          # 31005178260 lost that race by 243 ms.
          #
          # This also protects the shutdown assertion further down. A
          # SIGTERM delivered before `run_api_mode` has spawned the WAL
          # flush task produces no flush line at all, so a gate that
          # opens early turns that assertion into a coin flip too.
          ready() {
            for _ in $(seq 1 60); do
              if curl -sf --max-time 5 localhost:9090/metrics | grep -q '^all_smi_'; then
                return 0
              fi
              sleep 2
            done
            echo "::error::the exporter never rendered an all_smi_ metric line"
            echo "--- last /metrics response ---"
            curl -sv --max-time 5 localhost:9090/metrics 2>&1 | head -40
            return 1
          }

          "$BIN" service install --user --now
          ready
          "$BIN" service status --user
          "$BIN" service status --user --json | grep -q '"running": true'
          "$BIN" service status --user --json | grep -q '"enabled": true'
          curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_'
          # Assert a specific family rather than only "some line". The
          # runner is a VM with no IOReport, so the native metrics
          # manager fails to initialize and the GPU and chassis readers
          # degrade to zeros and to nothing respectively. The memory
          # reader is pure sysinfo with no failure path at all
          # (src/device/memory_macos.rs), which makes this the one line
          # guaranteed to be present on any macOS host.
          curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_memory_total_bytes'
          grep -q "API server listening" "$LOG"

          "$BIN" service restart --user
          ready

          # `stop` boots the job out, which is a SIGTERM. The final
          # energy-WAL flush has to be reached before launchd's
          # ExitTimeOut turns it into a SIGKILL (issues #191, #310).
          # Poll rather than sleeping a fixed amount: the flush runs on
          # spawn_blocking and ends in an fsync, and this job is the one
          # place that would notice it getting slower.
          "$BIN" service stop --user
          for _ in $(seq 1 30); do
            grep -q "energy WAL: shutdown requested" "$LOG" && break || sleep 1
          done
          grep -q "energy WAL: shutdown requested" "$LOG"
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3
          "$BIN" service status --user --json | grep -q '"installed": true'

          # A persistent disable override outlives the plist and a
          # reboot, so `install` has to clear it and `status` has to see
          # it.
          launchctl disable "$TARGET"
          "$BIN" service status --user --json | grep -q '"enabled": false'
          "$BIN" service install --user
          "$BIN" service status --user --json | grep -q '"enabled": true'

          "$BIN" service uninstall --user
          test ! -f "$PLIST"
          # `launchctl bootout` returns before launchd has finished
          # tearing the job down. That is the same race BOOTSTRAP_ATTEMPTS
          # in src/service_cmd/launchctl.rs exists to absorb, so sampling
          # `launchctl print` exactly once here would be the same
          # gate-versus-assertion mistake in a different costume.
          for _ in $(seq 1 30); do
            launchctl print "$TARGET" >/dev/null 2>&1 || break
            sleep 1
          done
          launchctl print "$TARGET" >/dev/null 2>&1 && rc=0 || rc=$?
          test "$rc" -ne 0
          # `uninstall` keeps the log deliberately.
          test -f "$LOG"

  # ═══════════════════════════════════════════════════════════════
  # Job: Windows Service Control Manager smoke test (issue #311)
  # ═══════════════════════════════════════════════════════════════
  # Opt-in and disabled by default. It needs the self-hosted
  # `windows-on-macmini02-x64` runner, which no fork has, and an
  # elevated runner service, because every mutating SCM action requires
  # Administrator rights.
  #
  # To enable: set the repository variable ENABLE_WINDOWS_SERVICE_SMOKE
  # to `true`. While it is unset, `vars.ENABLE_WINDOWS_SERVICE_SMOKE`
  # evaluates to the empty string and the job is skipped everywhere,
  # including on forks.
  #
  # THIS JOB HAS NEVER EXECUTED. It was written alongside the backend on
  # a macOS host with no access to Windows or to the runner, so treat
  # its first real run as part of the work, not as a regression signal.
  #
  # The cleanup step is `if: always()` on purpose: a half-finished run
  # that left `all-smi` registered would poison every later run on a
  # persistent self-hosted runner.
  # ───────────────────────────────────────────────────────────────
  windows-service:
    name: Windows Service Smoke Test
    if: vars.ENABLE_WINDOWS_SERVICE_SMOKE == 'true'
    runs-on: windows-on-macmini02-x64
    needs: test
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same persistent paths the release job pins, so registry and
      # toolchain survive workspace cleanup between jobs.
      - name: Setup persistent cache paths
        run: |
          $cargoHome = "C:\.cargo"
          if (!(Test-Path $cargoHome)) { New-Item -ItemType Directory -Path $cargoHome -Force | Out-Null }
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "RUSTUP_HOME=C:\.rustup" >> $env:GITHUB_ENV

      # protoc is deliberately absent: build.rs compiles the TPU protos
      # on Linux only, so a Windows build needs no protoc at all.
      - name: Build all-smi
        run: cargo build --bin all-smi

      - name: Require an elevated runner
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($id)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Output "::error::the runner service is not elevated; every mutating Service Control Manager action needs Administrator rights. Reconfigure the runner to run as an administrator, or unset ENABLE_WINDOWS_SERVICE_SMOKE."
            exit 1
          }

      # The diagnostics function is not scaffolding. A Windows service
      # that fails to start reports nothing but a numeric error code
      # through the SCM, and the actual explanation is in the log file
      # under %PROGRAMDATA%. Without dumping `sc.exe query`, `sc.exe qc`,
      # and that log, a red run here is undebuggable from CI output
      # alone. Keep it.
      - name: Service lifecycle
        run: |
          $ErrorActionPreference = "Stop"
          # PowerShell 7.4 turns a non-zero native exit code into a
          # terminating error by default. This job asserts on exit codes 1
          # and 3 as documented behaviour, so that has to stay off.
          $PSNativeCommandUseErrorActionPreference = $false
          $bin = Join-Path $PWD "target\debug\all-smi.exe"
          $programData = [Environment]::GetFolderPath("CommonApplicationData")
          $appDir = Join-Path $programData "all-smi"
          $logDir = Join-Path $appDir "logs"
          $configPath = Join-Path $appDir "config.toml"

          function Show-Diagnostics {
            Write-Output "::group::diagnostics: all-smi Windows service"
            Write-Output "--- sc.exe query ---"
            & sc.exe query all-smi 2>&1 | Out-String
            Write-Output "--- sc.exe qc (registered configuration) ---"
            & sc.exe qc all-smi 2>&1 | Out-String
            Write-Output "--- sc.exe qfailure (recovery actions) ---"
            & sc.exe qfailure all-smi 2>&1 | Out-String
            Write-Output "--- all-smi service status --json ---"
            & $bin service status --json 2>&1 | Out-String
            Write-Output "--- effective configuration ($configPath) ---"
            if (Test-Path $configPath) { Get-Content $configPath } else { Write-Output "(absent)" }
            Write-Output "--- all-smi config path ---"
            & $bin config path 2>&1 | Out-String
            Write-Output "--- service log tail ($logDir) ---"
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -File | Sort-Object LastWriteTime |
                ForEach-Object {
                  Write-Output "=== $($_.FullName) ==="
                  Get-Content $_.FullName -Tail 200
                }
            } else {
              Write-Output "(no log directory: the service never reached logging init)"
            }
            Write-Output "::endgroup::"
          }

          function Invoke-Step([string]$label, [scriptblock]$body) {
            Write-Output "== $label"
            try { & $body } catch { Show-Diagnostics; throw }
          }

          # Exit code contract, mirroring `systemctl is-active`: 0 when
          # running, 3 when installed-but-stopped or absent, 1 on error.
          function Get-ServiceExitCode([string[]]$serviceArgs) {
            & $bin @serviceArgs | Out-Host
            return $LASTEXITCODE
          }

          Invoke-Step "status on a machine with no service must exit 3" {
            $code = Get-ServiceExitCode @("service", "status")
            if ($code -ne 3) { throw "expected exit 3 for an absent service, got $code" }
          }

          Invoke-Step "--user must be refused, not silently downgraded" {
            $out = & $bin service status --user 2>&1 | Out-String
            if ($LASTEXITCODE -ne 1) { throw "expected exit 1 for --user, got $LASTEXITCODE" }
            if ($out -notmatch "Task Scheduler") { throw "the --user refusal must point at Task Scheduler; got: $out" }
          }

          Invoke-Step "service run from a console must explain itself" {
            $out = & $bin service run 2>&1 | Out-String
            if ($LASTEXITCODE -ne 1) { throw "expected exit 1 for a console-launched service run, got $LASTEXITCODE" }
            if ($out -notmatch "Service Control Manager entry point") { throw "unexpected message: $out" }
          }

          Invoke-Step "%PROGRAMDATA% config must be honoured by the service" {
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            Set-Content -Path $configPath -Value "[api]`nport = 19191`n" -Encoding utf8
            & $bin config path | Out-Host
          }

          Invoke-Step "install --now registers, autostarts, and starts" {
            & $bin service install --now
            if ($LASTEXITCODE -ne 0) { throw "install --now exited $LASTEXITCODE" }
            $qc = & sc.exe qc all-smi | Out-String
            if ($qc -notmatch "AUTO_START") { throw "start type must be AUTO_START: $qc" }
            if ($qc -notmatch "service run") { throw "the registered command line must end in the service run arguments: $qc" }
            if ($qc -notmatch "LocalSystem") { throw "the service must run as LocalSystem: $qc" }
          }

          Invoke-Step "the service reaches RUNNING and serves the configured port" {
            $ok = $false
            foreach ($i in 1..60) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw "the service never reported running" }
            $body = (Invoke-WebRequest "http://127.0.0.1:19191/metrics" -UseBasicParsing -TimeoutSec 10).Content
            if ($body -notmatch "all_smi_") { throw "the metrics endpoint returned no all-smi metrics" }
            $json = & $bin service status --json | Out-String
            if ($json -notmatch '"running": true') { throw "status --json disagrees with the SCM: $json" }
          }

          Invoke-Step "logs land under %PROGRAMDATA%" {
            if (-not (Test-Path $logDir)) { throw "no log directory at $logDir" }
            if (-not (Get-ChildItem $logDir -File)) { throw "the log directory at $logDir is empty" }
          }

          Invoke-Step "a killed process is restarted by the configured failure actions" {
            $pidBefore = ((& $bin service status --json | Out-String) | ConvertFrom-Json).pid
            & taskkill /F /PID $pidBefore | Out-Host
            $recovered = $false
            foreach ($i in 1..90) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $pidAfter = ((& $bin service status --json | Out-String) | ConvertFrom-Json).pid
                if ($pidAfter -and $pidAfter -ne $pidBefore) { $recovered = $true; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $recovered) { throw "the SCM did not restart the service after taskkill /F" }
          }

          Invoke-Step "stop settles before returning, and status agrees" {
            & $bin service stop
            if ($LASTEXITCODE -ne 0) { throw "stop exited $LASTEXITCODE" }
            & $bin service status | Out-Null
            if ($LASTEXITCODE -ne 3) { throw "a stopped service must report exit 3, got $LASTEXITCODE" }
          }

          Invoke-Step "restart brings it back" {
            & $bin service restart
            if ($LASTEXITCODE -ne 0) { throw "restart exited $LASTEXITCODE" }
            $ok = $false
            foreach ($i in 1..60) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw "the service did not come back after restart" }
          }

          Invoke-Step "uninstall stops and deregisters" {
            & $bin service uninstall
            if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
            & $bin service status | Out-Null
            if ($LASTEXITCODE -ne 3) { throw "an absent service must report exit 3, got $LASTEXITCODE" }
          }

      # Unconditional: a persistent self-hosted runner must never be
      # left with a registered `all-smi` service or a stray config file,
      # whatever happened above.
      - name: Cleanup
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          $programData = [Environment]::GetFolderPath("CommonApplicationData")
          $appDir = Join-Path $programData "all-smi"
          & sc.exe stop all-smi 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          & sc.exe delete all-smi 2>&1 | Out-Null
          Remove-Item (Join-Path $appDir "config.toml") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir "logs") -Recurse -Force -ErrorAction SilentlyContinue
          $remaining = & sc.exe query all-smi 2>&1 | Out-String
          if ($remaining -notmatch "1060") {
            Write-Output "::warning::the all-smi service may still be registered on this runner: $remaining"
          }
          exit 0

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install AMD GPU development libraries
      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      # protoc: cached install via composite action
      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binary
        run: cargo build --release --bin all-smi

      - name: Build library-only (no default features)
        run: cargo build --no-default-features --lib

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max