name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "31.1"  # or "32.0-rc-2" etc.

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install AMD GPU development libraries
      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      # protoc: cached install via composite action
      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The Level Zero loader ships as its own package on Ubuntu, separate
      # from the Intel GPU driver, so a runner with no GPU can still load
      # it. That is worth doing: it is the only part of the FFI surface
      # reachable without hardware, and until now nothing checked it. The
      # test it enables asserts that every path in `LIBZE_PATHS` resolves
      # and every mandatory symbol in `LzApi` is spelled the way the real
      # library exports it. Both are invisible to the compiler and would
      # otherwise turn the whole backend into a silent no-op on real
      # hardware.
      #
      # No device is involved, so nothing here attempts `zeInit`.
      - name: Install the Level Zero loader
        run: |
          set -eu
          sudo apt-get install -y libze1 || sudo apt-get install -y level-zero
          if ! ldconfig -p | grep -q 'libze_loader\.so\.1'; then
            echo "::error::the loader package installed but libze_loader.so.1 is not on the linker path; the package name in this step is probably wrong"
            exit 1
          fi
          ldconfig -p | grep libze_loader

      # `cargo test` with no flags now covers the Level Zero backend:
      # build.rs turns `all_smi_level_zero` on for every Linux target, so
      # there is no configuration in which the module goes uncompiled and
      # its tests filtered out. That hole is what let two defects reach
      # issue #364.
      #
      # ALL_SMI_EXPECT_LEVEL_ZERO_LOADER turns the loader test above from
      # a skip into an assertion. It is opt-in so the same test is a no-op
      # on a developer host with no loader installed.
      - name: Run tests
        run: cargo test --verbose
        env:
          ALL_SMI_EXPECT_LEVEL_ZERO_LOADER: "1"

      - name: Check formatting
        run: cargo fmt --check

      # `--all-targets` is deliberate. Without it clippy lints only lib and
      # bin, leaving every test target unchecked, which is where a good
      # deal of this crate's logic lives.
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # `level_zero` is an accepted no-op now that the backend is
      # unconditional. Nothing else would notice if passing it started
      # failing, and a downstream manifest that lists it would break
      # without warning.
      - name: The level_zero feature is still accepted
        run: cargo build --features level_zero --bin all-smi

  # ═══════════════════════════════════════════════════════════════
  # Job: Packaging Sync (issue #309)
  # ═══════════════════════════════════════════════════════════════
  # packaging/systemd/ holds the canonical unit and environment file.
  # debian/ carries byte-identical copies because the Launchpad job
  # overlays only debian/ onto a release-tag checkout, and the unit has
  # to sit at debian/all-smi.service for dh_installsystemd to find it.
  # Two sources of truth drift, so assert they never do. No toolchain
  # needed, so this fails within seconds of a mismatch.
  # ───────────────────────────────────────────────────────────────
  packaging-sync:
    name: Packaging Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: debian/ copies must match packaging/systemd/
        run: |
          set -eu
          fail=0
          for pair in "all-smi.service" "all-smi.default"; do
            if ! diff -u "packaging/systemd/${pair}" "debian/${pair}"; then
              echo "::error file=debian/${pair}::debian/${pair} has drifted from packaging/systemd/${pair}; copy the canonical file over it"
              fail=1
            fi
          done
          exit "$fail"

  # ═══════════════════════════════════════════════════════════════
  # Job: systemd service lifecycle smoke test (issue #309)
  # ═══════════════════════════════════════════════════════════════
  # Exercises `all-smi service` end to end against a real systemd, in
  # BOTH scopes, on every run (issue #330).
  #
  # These used to be an either/or: a probe set `user_scope`, the
  # user-scope step ran when it was true and the system-scope step when
  # it was false. On `ubuntu-latest` a per-user manager is always
  # present, so `user_scope` was always true and the system-scope step
  # had never executed once since #309 added it. Everything in it was
  # unverified code sitting in the workflow, which is why three #309
  # acceptance criteria stayed unchecked: crash recovery via `kill -9`,
  # the privileged tarball install/uninstall lifecycle, and
  # /etc/all-smi/config.toml actually moving the listener. All three are
  # reachable on a hosted runner through passwordless sudo, so the
  # system-scope step now runs unconditionally.
  #
  # The probe survives, narrowed to its one honest use: skipping the
  # user-scope step on a runner that genuinely has no user manager. The
  # system-scope step no longer consults it.
  #
  # Ordering is deliberate, not incidental. User scope runs first
  # because the system-scope step writes /etc/all-smi/config.toml, and
  # that path is a discovery candidate for *every* all-smi process on
  # the host (`LINUX_SYSTEM_CONFIG_PATH` in src/common/paths.rs), so a
  # user-scope daemon started after it would silently inherit
  # port 19191. The two scopes are otherwise disjoint: different unit
  # paths, different managers, different ports (9090 vs 19191).
  #
  # `Clean up all systemd state` is `if: always()` so a step that dies
  # mid-lifecycle cannot leave an enabled unit, a config file, or a
  # running daemon behind for a later run to trip over.
  #
  # Readiness gating (issues #323, #324, #329). Every wait for "the
  # exporter is up" in this job polls `/-/ready`, never `systemctl
  # is-active` and never a plain HTTP 200 on `/metrics`. The rule exists
  # because a gate that opens on a weaker condition than the assertion it
  # protects is a flake waiting for a slow runner: PR #323 fixed exactly
  # that on the launchd job after run 31005178260 lost the race by
  # 243 ms. Note that `curl -sf .../metrics` is permanently unusable as a
  # gate now, because #324 made `/metrics` answer 200 from the moment the
  # listener binds, by design. `/-/ready` is the purpose-built signal:
  # 503 until the first collection cycle lands, 200 after.
  # ───────────────────────────────────────────────────────────────
  systemd-service:
    name: systemd Service Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all-smi
        run: cargo build --bin all-smi

      # Gates the user-scope step only. The system-scope step runs
      # regardless (#330): it needs root, not a user manager, and sudo is
      # passwordless on hosted runners.
      - name: Probe for a user systemd instance
        id: probe
        run: |
          if systemctl --user show-environment >/dev/null 2>&1; then
            echo "user_scope=true" >> "$GITHUB_OUTPUT"
          else
            echo "user_scope=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no user systemd instance on this runner; skipping the user-scope step (the system-scope step still runs)"
          fi

      # ── User scope: install, start, restart, stop, uninstall ──
      #
      # The ERR trap is not scaffolding: a unit that a per-user manager
      # cannot apply dies before ExecStart, and `systemctl --user start`
      # reports only "control process exited with error code". Without
      # the journal and the rendered unit in the log, that failure is
      # undebuggable from CI output alone. Keep the trap.
      - name: User-scope lifecycle
        if: steps.probe.outputs.user_scope == 'true'
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          UNIT="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/all-smi.service"

          diagnose() {
            set +x
            echo "::group::diagnostics: user-scope all-smi.service"
            echo "--- rendered unit ($UNIT) ---"
            cat "$UNIT" 2>&1 || true
            echo "--- systemctl --user status ---"
            systemctl --user status all-smi.service --no-pager -l 2>&1 || true
            echo "--- systemctl --user show (failure detail) ---"
            systemctl --user show all-smi.service \
              -p LoadState -p ActiveState -p SubState -p Result \
              -p ExecMainCode -p ExecMainStatus -p StatusErrno -p InvocationID 2>&1 || true
            echo "--- journalctl --user ---"
            journalctl --user -xeu all-smi.service --no-pager -n 200 2>&1 || true
            echo "--- host namespace policy (the usual cause) ---"
            sysctl user.max_user_namespaces 2>&1 || true
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3  # not installed yet

          "$BIN" service install --user
          test -f "$UNIT"
          head -1 "$UNIT" | grep -qF "# Managed by 'all-smi service'"
          grep -q "^WantedBy=default.target$" "$UNIT"

          # Every directive a per-user manager cannot apply must be
          # absent. Each of these makes the unit fail before ExecStart,
          # which is exactly the class of bug this job exists to catch.
          for forbidden in \
              "User=" "Group=" "SupplementaryGroups=" "ProtectKernelModules=" \
              "ProtectSystem=" "ProtectHome=" "PrivateTmp=" "ProtectControlGroups="; do
            if grep -q "^${forbidden}" "$UNIT"; then
              echo "::error::user-scope unit contains ${forbidden}, which a per-user systemd manager cannot apply"
              diagnose
              exit 1
            fi
          done
          # ...and the privilege-free hardening must survive.
          grep -q "^NoNewPrivileges=true$" "$UNIT"
          grep -q "^RestrictSUIDSGID=true$" "$UNIT"

          # systemd's own parser is the authority on whether the rendered
          # unit is valid. Also covers the issue's `systemd-analyze
          # verify` acceptance criterion.
          systemd-analyze --user verify "$UNIT"

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3  # installed, not started
          "$BIN" service status --user --json | grep -q '"installed": true'

          "$BIN" service start --user
          for _ in $(seq 1 30); do
            "$BIN" service status --user && break || sleep 1
          done
          "$BIN" service status --user

          "$BIN" service restart --user
          "$BIN" service stop --user
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

          "$BIN" service uninstall --user
          test ! -f "$UNIT"

          # `--now` is a distinct code path (`systemctl enable --now`
          # rather than `enable` followed by `start`), so exercise it
          # rather than inferring it from the two halves above.
          "$BIN" service install --user --now
          for _ in $(seq 1 30); do
            "$BIN" service status --user && break || sleep 1
          done
          "$BIN" service status --user
          "$BIN" service status --user --json | grep -q '"running": true'

          "$BIN" service uninstall --user
          test ! -f "$UNIT"
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

      # ── System scope: the same lifecycle under sudo, plus the three
      #    things only a privileged daemon can demonstrate ──
      #
      # Runs unconditionally (#330). Before that it was gated on the
      # absence of a user manager, a condition `ubuntu-latest` never
      # meets, so this step had never executed. It is not a fallback for
      # the user-scope step: it covers strictly more, namely crash
      # recovery through `kill -9`, the privileged install/uninstall
      # lifecycle, and /etc/all-smi/config.toml moving the listener.
      # Those are #309's three remaining unverified criteria.
      - name: System-scope lifecycle
        run: |
          set -eEux
          UNIT=/etc/systemd/system/all-smi.service

          # Stage the binary outside $HOME before installing it, the way
          # a tarball install actually would. This is load bearing, not
          # tidiness: the system unit sets ProtectHome=true, so a service
          # whose ExecStart points into /home/runner/work/... cannot be
          # executed at all. systemd fails it with 203/EXEC before the
          # process starts, and the journal says only "Main process
          # exited, code=exited, status=203/EXEC".
          #
          # That is a genuine property of the hardened unit, not a CI
          # artifact, and the fix belongs here rather than in the unit:
          # relaxing ProtectHome to make a test pass would weaken every
          # real deployment to accommodate a binary location no real
          # deployment uses. #309's criterion is specifically "from a
          # plain tarball install", and /usr/local/bin is where that
          # puts it, so installing from there makes this step a more
          # faithful test of the criterion rather than a workaround.
          #
          # Nobody hit this before because the step was gated behind a
          # condition ubuntu-latest never meets (#330), so it had never
          # executed.
          BIN=/usr/local/bin/all-smi
          sudo install -m 0755 "$PWD/target/debug/all-smi" "$BIN"

          # Same rationale as the user-scope trap: a unit that fails
          # before ExecStart produces an opaque error, so always dump the
          # journal and the rendered unit. Keep this permanently.
          diagnose() {
            set +x
            echo "::group::diagnostics: system-scope all-smi.service"
            echo "--- rendered unit ($UNIT) ---"
            sudo cat "$UNIT" 2>&1 || true
            echo "--- systemctl status ---"
            sudo systemctl status all-smi.service --no-pager -l 2>&1 || true
            echo "--- systemctl show (failure detail) ---"
            sudo systemctl show all-smi.service \
              -p LoadState -p ActiveState -p SubState -p Result \
              -p ExecMainCode -p ExecMainStatus -p StatusErrno -p InvocationID 2>&1 || true
            echo "--- journalctl ---"
            sudo journalctl -xeu all-smi.service --no-pager -n 200 2>&1 || true
            echo "--- effective configuration ---"
            sudo cat /etc/all-smi/config.toml 2>&1 || true
            sudo cat /etc/default/all-smi 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          # Unprivileged mutation must be refused with the documented message.
          "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service install 2>&1 | grep -q "requires root"

          # /etc/all-smi/config.toml must be honoured by the daemon, which
          # runs as root with no reachable home directory.
          sudo install -d -m 0755 /etc/all-smi
          printf '[api]\nport = 19191\n' | sudo tee /etc/all-smi/config.toml >/dev/null
          printf 'RUST_LOG=info\n' | sudo tee /etc/default/all-smi >/dev/null

          sudo "$BIN" service install --now
          sudo test -f "$UNIT"
          sudo head -1 "$UNIT" | grep -qF "# Managed by 'all-smi service'"
          # ExecStart must point at the binary that ran the install, not
          # at a hard-coded packaged path. Matched loosely because
          # current_exe() canonicalizes and the staged path may sit
          # behind a symlink.
          sudo grep -q "^ExecStart=.*/all-smi api$" "$UNIT"
          # ...and specifically not somewhere ProtectHome=true would make
          # unreachable, which is what 203/EXEC looks like from the
          # journal.
          if sudo grep -q "^ExecStart=/home/" "$UNIT"; then
            echo "::error::ExecStart points into /home, which ProtectHome=true makes unreachable (203/EXEC)"
            diagnose
            exit 1
          fi
          sudo grep -q "^WantedBy=multi-user.target$" "$UNIT"
          # A system manager runs as root and can apply the full
          # hardening set, so unlike user scope none of it is dropped.
          for required in \
              "NoNewPrivileges=true" "ProtectSystem=strict" "ProtectHome=true" \
              "PrivateTmp=true" "ProtectKernelModules=true" \
              "ProtectControlGroups=true" "RestrictSUIDSGID=true"; do
            sudo grep -q "^${required}$" "$UNIT" || {
              echo "::error::system-scope unit lost hardening directive ${required}"
              diagnose
              exit 1
            }
          done
          # systemd's own parser is the authority. Also covers the
          # issue's `systemd-analyze verify` acceptance criterion.
          sudo systemd-analyze verify "$UNIT"
          systemctl is-enabled all-smi

          # Readiness gate (issues #329, #324). Poll the exporter's own
          # readiness endpoint, which is the condition the assertions
          # below actually require, rather than a proxy for it.
          #
          # `systemctl is-active` was the old gate and is the wrong
          # question. For Type=exec it reports active as soon as the
          # binary has been executed, which says nothing about whether
          # the listener is bound or whether a collection cycle has run.
          # It survived only because the assertion downstream was
          # `curl -sf | head -5`, where `head` swallows the pipeline's
          # exit status so an empty body could not fail it. Tightening
          # that assertion without fixing this gate would have
          # reintroduced the exact flake PR #323 fixed on the launchd
          # side, where run 31005178260 lost the race by 243 ms.
          #
          # `/-/ready` (added by #324) returns 503 until the collection
          # loop's first iteration has written into AppState, and 200
          # after. That write is the same one that publishes
          # `all_smi_memory_total_bytes`, so a 200 here is not merely
          # correlated with the assertion below, it is the same event.
          # Do not weaken this back to `is-active` or to a plain HTTP
          # 200 on `/metrics`: since #324 `/metrics` answers 200 from
          # the moment the listener binds, deliberately, so it can never
          # serve as a readiness gate again.
          #
          # Polling port 19191 rather than the default 9090 also means
          # the gate itself proves /etc/all-smi/config.toml moved the
          # listener (#309, #330).
          ready() {
            for _ in $(seq 1 60); do
              if curl -sf --max-time 5 "http://127.0.0.1:19191/-/ready" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "::error::the exporter never reported ready on 127.0.0.1:19191/-/ready"
            echo "--- last /-/ready response ---"
            curl -sv --max-time 5 "http://127.0.0.1:19191/-/ready" 2>&1 | head -40
            echo "--- last /metrics response ---"
            curl -sv --max-time 5 "http://127.0.0.1:19191/metrics" 2>&1 | head -40
            echo "--- listeners ---"
            sudo ss -lntp 2>&1 | head -20 || true
            return 1
          }

          ready

          sudo "$BIN" service status
          sudo "$BIN" service status --json | grep -q '"running": true'
          # Assert on rendered content, not on the port merely answering.
          # `all_smi_memory_total_bytes` rather than a bare `^all_smi_`
          # prefix: since #324 the baseline families (`all_smi_up`,
          # `all_smi_build_info`) are emitted unconditionally, so
          # `^all_smi_` now matches even when every device reader has
          # failed. The Linux memory reader is /proc/meminfo with no
          # failure path, which makes this the family guaranteed present
          # on any runner, and it is a real collected value rather than
          # the exporter describing itself.
          curl -sf --max-time 10 http://127.0.0.1:19191/metrics | grep -q '^all_smi_memory_total_bytes'

          # #309 asks that api.port in /etc/all-smi/config.toml "moves"
          # the listener, so answering on 19191 is only half the proof:
          # a daemon that ignored the file and also happened to bind
          # 19191, or one that bound both, would pass that alone. Assert
          # the compiled default is NOT listening.
          if curl -sf --max-time 5 http://127.0.0.1:9090/metrics >/dev/null 2>&1; then
            echo "::error::the daemon is still serving on the default port 9090; /etc/all-smi/config.toml did not move the listener"
            sudo ss -lntp 2>&1 | head -20 || true
            diagnose
            exit 1
          fi

          # Crash recovery: systemd must bring it back within RestartSec.
          MAINPID=$(systemctl show all-smi -p MainPID --value)
          sudo kill -9 "$MAINPID"
          for _ in $(seq 1 40); do
            NEWPID=$(systemctl show all-smi -p MainPID --value)
            if systemctl is-active --quiet all-smi && [ "$NEWPID" != "$MAINPID" ] && [ "$NEWPID" != "0" ]; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet all-smi || {
            echo "::error::service did not come back after kill -9 within RestartSec"
            diagnose
            exit 1
          }
          # `is-active` with a changed MainPID is the right question for
          # "did systemd restart it", but not for "is it usable again".
          # The criterion this covers on #309 is that the service
          # survives a crash, so wait for it to serve once more.
          ready
          curl -sf --max-time 10 http://127.0.0.1:19191/metrics | grep -q '^all_smi_memory_total_bytes'

          # `restart` was previously asserted only by its own exit code,
          # which says nothing about whether the replacement process came
          # up. Gate on the same readiness signal.
          sudo "$BIN" service restart
          ready

          sudo "$BIN" service stop
          sudo "$BIN" service status && rc=0 || rc=$?
          test "$rc" -eq 3

          sudo "$BIN" service uninstall
          sudo test ! -f "$UNIT"
          sudo rm -f /etc/all-smi/config.toml /etc/default/all-smi

      - name: Refuse to clobber a foreign unit
        run: |
          set -eux
          BIN="$PWD/target/debug/all-smi"
          UNIT=/etc/systemd/system/all-smi.service
          printf '[Unit]\nDescription=hand written\n' | sudo tee "$UNIT" >/dev/null

          sudo "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          sudo "$BIN" service install 2>&1 | grep -q "Managed by 'all-smi service'"

          # --force lifts the refusal, then clean up after ourselves.
          sudo "$BIN" service install --force
          sudo "$BIN" service uninstall
          sudo rm -f "$UNIT"
          sudo systemctl daemon-reload

      # ── Unconditional teardown (issue #330) ──
      #
      # Every cleanup line above sits on a success path, so any step that
      # died mid-lifecycle used to leave an enabled unit, a running
      # daemon on 19191, and /etc/all-smi/config.toml behind. On a hosted
      # runner that is merely untidy; on a self-hosted one it poisons the
      # next run, and the failure it causes there looks nothing like its
      # cause. Now that both scopes run, there is simply more state to
      # strand, so this is not optional.
      #
      # Deliberately best-effort throughout: `|| true` on every line and
      # `set +e`, because a teardown step that fails turns a green run
      # red for no reason, and masks the real failure when the run was
      # already red. It reports what it found instead.
      - name: Clean up all systemd state
        if: always()
        run: |
          set +e
          echo "::group::teardown: system scope"
          sudo systemctl stop all-smi.service 2>&1 || true
          sudo systemctl disable all-smi.service 2>&1 || true
          sudo rm -f /etc/systemd/system/all-smi.service || true
          sudo rm -f /etc/all-smi/config.toml /etc/default/all-smi || true
          sudo rmdir /etc/all-smi 2>/dev/null || true
          # Staged by the system-scope step to keep ExecStart out of
          # /home, where ProtectHome=true would make it unexecutable.
          sudo rm -f /usr/local/bin/all-smi || true
          sudo rm -rf /var/cache/all-smi || true
          sudo systemctl daemon-reload 2>&1 || true
          sudo systemctl reset-failed all-smi.service 2>&1 || true
          echo "::endgroup::"

          echo "::group::teardown: user scope"
          systemctl --user stop all-smi.service 2>&1 || true
          systemctl --user disable all-smi.service 2>&1 || true
          rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/all-smi.service" || true
          systemctl --user daemon-reload 2>&1 || true
          echo "::endgroup::"

          # `all-smi service install` never runs useradd: --service-user
          # only writes User= into the unit and expects the account to
          # already exist. This is belt and braces so the criterion is
          # satisfied by construction rather than by that argument
          # continuing to hold.
          if id -u all-smi >/dev/null 2>&1; then
            echo "::warning::an all-smi system user existed; removing it"
            sudo userdel all-smi 2>&1 || true
          fi

          # Prove the teardown worked rather than assuming it. Reported,
          # not enforced, so this step never turns a run red by itself.
          echo "--- residue check ---"
          LEFTOVER=0
          for path in /etc/systemd/system/all-smi.service /etc/all-smi/config.toml /etc/default/all-smi /usr/local/bin/all-smi; do
            if sudo test -e "$path"; then echo "::warning::left behind: $path"; LEFTOVER=1; fi
          done
          if systemctl list-unit-files 2>/dev/null | grep -q '^all-smi\.service'; then
            echo "::warning::left behind: an all-smi.service unit is still known to systemd"
            LEFTOVER=1
          fi
          if id -u all-smi >/dev/null 2>&1; then
            echo "::warning::left behind: all-smi system user"; LEFTOVER=1
          fi
          if [ "$LEFTOVER" = "0" ]; then echo "clean: no unit, no config, no service user"; fi
          exit 0

  # ═══════════════════════════════════════════════════════════════
  # Job: launchd service smoke test (issue #310)
  # ═══════════════════════════════════════════════════════════════
  # Runs on Apple Silicon so the native readers (IOReport, SMC,
  # thermalState) are actually exercised from a launchd context, not
  # just the plist renderer.
  #
  # Split into two tiers because a hosted runner may have no
  # bootstrappable GUI domain:
  #
  #  1. Render tier. `install --user` without `--now` writes the plist
  #     and touches launchd not at all, so plist validity, the managed
  #     marker, the user-scope key drops, and both refusal paths are
  #     checkable anywhere. Always runs.
  #  2. Lifecycle tier. Gated on `launchctl print gui/$UID` succeeding.
  #     Skips with a notice rather than failing where the domain is
  #     absent.
  #
  # The system domain is deliberately never touched: no
  # /Library/LaunchDaemons, no `sudo launchctl bootstrap system`.
  # ───────────────────────────────────────────────────────────────
  launchd-service:
    name: launchd Service Smoke Test
    runs-on: macos-14
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: osx-aarch_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all-smi
        run: cargo build --bin all-smi

      - name: Probe for a bootstrappable GUI domain
        id: probe
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "gui_domain=true" >> "$GITHUB_OUTPUT"
          else
            echo "gui_domain=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no gui/\$UID domain on this runner; running the render tier only"
          fi

      # ── Render tier: no launchd domain required ──
      #
      # launchd accepts a LaunchAgent carrying UserName/GroupName and
      # silently ignores them, so a regression that leaves those keys in
      # a user-scope plist cannot be caught by bootstrapping it. It has
      # to be caught here, on the rendered file.
      - name: Rendered plist is valid and correctly scoped
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"

          diagnose() {
            set +x
            echo "::group::diagnostics: rendered LaunchAgent plist"
            echo "--- $PLIST ---"
            cat "$PLIST" 2>&1 || echo "(absent)"
            echo "--- plutil ---"
            plutil -lint "$PLIST" 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3

          "$BIN" service install --user
          test -f "$PLIST"

          # launchd parses this with CFPropertyList; a stray `--` inside
          # the marker comment would make the whole job unloadable.
          plutil -lint "$PLIST"
          grep -qF "<!-- Managed by 'all-smi service' -->" "$PLIST"
          grep -qF "<string>api</string>" "$PLIST"
          grep -qF "$HOME/Library/Logs/all-smi/all-smi.log" "$PLIST"

          # Keys a gui/$UID domain cannot honour must be absent.
          for key in UserName GroupName InitGroups; do
            if grep -qF "<key>${key}</key>" "$PLIST"; then
              echo "::error::${key} must not survive into a user-scope plist"
              exit 1
            fi
          done

          # Installed but not bootstrapped is the documented state here.
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3
          "$BIN" service status --user --json | grep -q '"installed": true'

          "$BIN" service uninstall --user
          test ! -f "$PLIST"

      - name: Refuse an unelevated system install and a foreign plist
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"

          # System scope must refuse before writing anything at all.
          "$BIN" service install && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service install 2>&1 | grep -q "requires root"
          test ! -f /Library/LaunchDaemons/com.lablup.all-smi.plist

          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0"><dict><key>Label</key><string>hand written</string></dict></plist>' \
            > "$PLIST"
          "$BIN" service install --user && rc=0 || rc=$?
          test "$rc" -eq 1
          "$BIN" service uninstall --user && rc=0 || rc=$?
          test "$rc" -eq 1
          grep -q "hand written" "$PLIST"

          "$BIN" service uninstall --user --force
          test ! -f "$PLIST"

      # ── Lifecycle tier: needs a real gui/$UID domain ──
      - name: User-scope lifecycle
        if: steps.probe.outputs.gui_domain == 'true'
        run: |
          set -eEux
          BIN="$PWD/target/debug/all-smi"
          PLIST="$HOME/Library/LaunchAgents/com.lablup.all-smi.plist"
          LOG="$HOME/Library/Logs/all-smi/all-smi.log"
          TARGET="gui/$(id -u)/com.lablup.all-smi"

          # A job that fails to spawn under launchd reports almost
          # nothing through the exit code alone, so dump the three
          # places the reason can be before giving up.
          diagnose() {
            set +x
            echo "::group::diagnostics: launchd user-scope service"
            echo "--- $PLIST ---"
            cat "$PLIST" 2>&1 || echo "(absent)"
            echo "--- launchctl print $TARGET ---"
            launchctl print "$TARGET" 2>&1 || true
            echo "--- launchctl print-disabled gui/$(id -u) ---"
            launchctl print-disabled "gui/$(id -u)" 2>&1 | grep -i all-smi || true
            echo "--- $LOG ---"
            cat "$LOG" 2>&1 || echo "(absent)"
            echo "--- service status ---"
            "$BIN" service status --user 2>&1 || true
            echo "::endgroup::"
          }
          trap diagnose ERR

          # Every readiness wait polls `/-/ready`, which is the condition
          # the assertions downstream require rather than a proxy for it.
          #
          # Two weaker gates were tried and both race. `service status`
          # reports running the moment launchd spawns the program, long
          # before it has come up. Plain HTTP 200 on `/metrics` is not a
          # gate either, and since #324 it is permanently not one: that
          # endpoint answers 200 from the moment axum binds the listener,
          # deliberately, so that existing scrapers never see a non-200.
          # Run 31005178260 lost that race by 243 ms.
          #
          # PR #323 worked around this by polling for rendered metric
          # content (`grep -q '^all_smi_'`). That was the right fix at
          # the time, but #324 has since made it wrong twice over: the
          # baseline families it added mean `^all_smi_` now matches from
          # the very first request, so the old pattern would open the
          # gate immediately and race again, and `/-/ready` now exists as
          # the purpose-built signal. It returns 503 until the collection
          # loop's first iteration writes into AppState and 200 after,
          # which is the same event that publishes the metric families
          # asserted below. Kept identical to the systemd job's gate so
          # the two smoke tests cannot drift (#329).
          #
          # This also protects the shutdown assertion further down. A
          # SIGTERM delivered before `run_api_mode` has spawned the WAL
          # flush task produces no flush line at all, so a gate that
          # opens early turns that assertion into a coin flip too.
          ready() {
            for _ in $(seq 1 60); do
              if curl -sf --max-time 5 localhost:9090/-/ready >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "::error::the exporter never reported ready on localhost:9090/-/ready"
            echo "--- last /-/ready response ---"
            curl -sv --max-time 5 localhost:9090/-/ready 2>&1 | head -40
            echo "--- last /metrics response ---"
            curl -sv --max-time 5 localhost:9090/metrics 2>&1 | head -40
            return 1
          }

          "$BIN" service install --user --now
          ready
          "$BIN" service status --user
          "$BIN" service status --user --json | grep -q '"running": true'
          "$BIN" service status --user --json | grep -q '"enabled": true'
          # The #324 baseline must be present on a real launchd-managed
          # service, not only in the unit tests. This used to be a bare
          # `^all_smi_` check, which no longer distinguishes anything now
          # that the baseline is unconditional, so assert the baseline
          # itself and let the next check carry the real-data burden.
          curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_up'
          curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_build_info'
          # Assert a specific device family rather than only "some line".
          # The runner is a VM with no IOReport, so the native metrics
          # manager fails to initialize: the chassis reader emits nothing
          # and the GPU reader omits every series it would have sourced
          # from IOReport/SMC (issue #325 -- it used to publish those as
          # zeros, which was indistinguishable from an idle GPU). The
          # memory reader is pure sysinfo with no failure path at all
          # (src/device/memory_macos.rs), which makes this the one device
          # line guaranteed to be present on any macOS host. Distinct from
          # the baseline above: this one proves a collection cycle actually
          # produced data, which is what `/-/ready` gated on.
          curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_memory_total_bytes'
          # And the degradation must stay honest: no fabricated GPU
          # utilization on a host that cannot measure it.
          ! curl -sf --max-time 10 localhost:9090/metrics | grep -q '^all_smi_gpu_utilization'
          grep -q "API server listening" "$LOG"

          "$BIN" service restart --user
          ready

          # `stop` boots the job out, which is a SIGTERM. The final
          # energy-WAL flush has to be reached before launchd's
          # ExitTimeOut turns it into a SIGKILL (issues #191, #310).
          # Poll rather than sleeping a fixed amount: the flush runs on
          # spawn_blocking and ends in an fsync, and this job is the one
          # place that would notice it getting slower.
          "$BIN" service stop --user
          for _ in $(seq 1 30); do
            grep -q "energy WAL: shutdown requested" "$LOG" && break || sleep 1
          done
          grep -q "energy WAL: shutdown requested" "$LOG"
          "$BIN" service status --user && rc=0 || rc=$?
          test "$rc" -eq 3
          "$BIN" service status --user --json | grep -q '"installed": true'

          # A persistent disable override outlives the plist and a
          # reboot, so `install` has to clear it and `status` has to see
          # it.
          launchctl disable "$TARGET"
          "$BIN" service status --user --json | grep -q '"enabled": false'
          "$BIN" service install --user
          "$BIN" service status --user --json | grep -q '"enabled": true'

          "$BIN" service uninstall --user
          test ! -f "$PLIST"
          # `launchctl bootout` returns before launchd has finished
          # tearing the job down. That is the same race BOOTSTRAP_ATTEMPTS
          # in src/service_cmd/launchctl.rs exists to absorb, so sampling
          # `launchctl print` exactly once here would be the same
          # gate-versus-assertion mistake in a different costume.
          for _ in $(seq 1 30); do
            launchctl print "$TARGET" >/dev/null 2>&1 || break
            sleep 1
          done
          launchctl print "$TARGET" >/dev/null 2>&1 && rc=0 || rc=$?
          test "$rc" -ne 0
          # `uninstall` keeps the log deliberately.
          test -f "$LOG"

  # ═══════════════════════════════════════════════════════════════
  # Job: Windows Service Control Manager smoke test (issue #311)
  # ═══════════════════════════════════════════════════════════════
  # Opt-in and disabled by default. It needs the self-hosted
  # `windows-on-macmini02-x64` runner, which no fork has, and an
  # elevated runner service, because every mutating SCM action requires
  # Administrator rights.
  #
  # To enable: set the repository variable ENABLE_WINDOWS_SERVICE_SMOKE
  # to `true`. While it is unset, `vars.ENABLE_WINDOWS_SERVICE_SMOKE`
  # evaluates to the empty string and the job is skipped everywhere,
  # including on forks.
  #
  # THIS JOB HAS NEVER EXECUTED. It was written alongside the backend on
  # a macOS host with no access to Windows or to the runner, so treat
  # its first real run as part of the work, not as a regression signal.
  #
  # The cleanup step is `if: always()` on purpose: a half-finished run
  # that left `all-smi` registered would poison every later run on a
  # persistent self-hosted runner.
  # ───────────────────────────────────────────────────────────────
  windows-service:
    name: Windows Service Smoke Test
    if: vars.ENABLE_WINDOWS_SERVICE_SMOKE == 'true'
    runs-on: windows-on-macmini02-x64
    needs: test
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same persistent paths the release job pins, so registry and
      # toolchain survive workspace cleanup between jobs.
      - name: Setup persistent cache paths
        run: |
          $cargoHome = "C:\.cargo"
          if (!(Test-Path $cargoHome)) { New-Item -ItemType Directory -Path $cargoHome -Force | Out-Null }
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "RUSTUP_HOME=C:\.rustup" >> $env:GITHUB_ENV

      # protoc is deliberately absent: build.rs compiles the TPU protos
      # on Linux only, so a Windows build needs no protoc at all.
      #
      # No `--features level_zero` here, on purpose. build.rs emits the
      # `all_smi_level_zero` cfg for every Windows target regardless of the
      # feature, so a plain build already includes the backend. Passing the
      # flag would compile the same thing while testing a configuration we
      # do not ship; leaving it off means this job builds exactly what the
      # release artifact is. The job is opt-in via
      # ENABLE_WINDOWS_SERVICE_SMOKE, so this is coverage when the runner
      # is available rather than a guarantee.
      - name: Build all-smi
        run: cargo build --bin all-smi

      - name: Require an elevated runner
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($id)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Output "::error::the runner service is not elevated; every mutating Service Control Manager action needs Administrator rights. Reconfigure the runner to run as an administrator, or unset ENABLE_WINDOWS_SERVICE_SMOKE."
            exit 1
          }

      # The diagnostics function is not scaffolding. A Windows service
      # that fails to start reports nothing but a numeric error code
      # through the SCM, and the actual explanation is in the log file
      # under %PROGRAMDATA%. Without dumping `sc.exe query`, `sc.exe qc`,
      # and that log, a red run here is undebuggable from CI output
      # alone. Keep it.
      - name: Service lifecycle
        run: |
          $ErrorActionPreference = "Stop"
          # PowerShell 7.4 turns a non-zero native exit code into a
          # terminating error by default. This job asserts on exit codes 1
          # and 3 as documented behaviour, so that has to stay off.
          $PSNativeCommandUseErrorActionPreference = $false
          $bin = Join-Path $PWD "target\debug\all-smi.exe"
          $programData = [Environment]::GetFolderPath("CommonApplicationData")
          $appDir = Join-Path $programData "all-smi"
          $logDir = Join-Path $appDir "logs"
          $configPath = Join-Path $appDir "config.toml"

          function Show-Diagnostics {
            Write-Output "::group::diagnostics: all-smi Windows service"
            Write-Output "--- sc.exe query ---"
            & sc.exe query all-smi 2>&1 | Out-String
            Write-Output "--- sc.exe qc (registered configuration) ---"
            & sc.exe qc all-smi 2>&1 | Out-String
            Write-Output "--- sc.exe qfailure (recovery actions) ---"
            & sc.exe qfailure all-smi 2>&1 | Out-String
            Write-Output "--- all-smi service status --json ---"
            & $bin service status --json 2>&1 | Out-String
            Write-Output "--- effective configuration ($configPath) ---"
            if (Test-Path $configPath) { Get-Content $configPath } else { Write-Output "(absent)" }
            Write-Output "--- all-smi config path ---"
            & $bin config path 2>&1 | Out-String
            Write-Output "--- service log tail ($logDir) ---"
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -File | Sort-Object LastWriteTime |
                ForEach-Object {
                  Write-Output "=== $($_.FullName) ==="
                  Get-Content $_.FullName -Tail 200
                }
            } else {
              Write-Output "(no log directory: the service never reached logging init)"
            }
            Write-Output "::endgroup::"
          }

          function Invoke-Step([string]$label, [scriptblock]$body) {
            Write-Output "== $label"
            try { & $body } catch { Show-Diagnostics; throw }
          }

          # Exit code contract, mirroring `systemctl is-active`: 0 when
          # running, 3 when installed-but-stopped or absent, 1 on error.
          function Get-ServiceExitCode([string[]]$serviceArgs) {
            & $bin @serviceArgs | Out-Host
            return $LASTEXITCODE
          }

          Invoke-Step "status on a machine with no service must exit 3" {
            $code = Get-ServiceExitCode @("service", "status")
            if ($code -ne 3) { throw "expected exit 3 for an absent service, got $code" }
          }

          Invoke-Step "--user must be refused, not silently downgraded" {
            $out = & $bin service status --user 2>&1 | Out-String
            if ($LASTEXITCODE -ne 1) { throw "expected exit 1 for --user, got $LASTEXITCODE" }
            if ($out -notmatch "Task Scheduler") { throw "the --user refusal must point at Task Scheduler; got: $out" }
          }

          Invoke-Step "service run from a console must explain itself" {
            $out = & $bin service run 2>&1 | Out-String
            if ($LASTEXITCODE -ne 1) { throw "expected exit 1 for a console-launched service run, got $LASTEXITCODE" }
            if ($out -notmatch "Service Control Manager entry point") { throw "unexpected message: $out" }
          }

          Invoke-Step "%PROGRAMDATA% config must be honoured by the service" {
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            Set-Content -Path $configPath -Value "[api]`nport = 19191`n" -Encoding utf8
            & $bin config path | Out-Host
          }

          Invoke-Step "install --now registers, autostarts, and starts" {
            & $bin service install --now
            if ($LASTEXITCODE -ne 0) { throw "install --now exited $LASTEXITCODE" }
            $qc = & sc.exe qc all-smi | Out-String
            if ($qc -notmatch "AUTO_START") { throw "start type must be AUTO_START: $qc" }
            if ($qc -notmatch "service run") { throw "the registered command line must end in the service run arguments: $qc" }
            if ($qc -notmatch "LocalSystem") { throw "the service must run as LocalSystem: $qc" }
          }

          Invoke-Step "the service reaches RUNNING and serves the configured port" {
            $ok = $false
            foreach ($i in 1..60) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw "the service never reported running" }
            $body = (Invoke-WebRequest "http://127.0.0.1:19191/metrics" -UseBasicParsing -TimeoutSec 10).Content
            if ($body -notmatch "all_smi_") { throw "the metrics endpoint returned no all-smi metrics" }
            $json = & $bin service status --json | Out-String
            if ($json -notmatch '"running": true') { throw "status --json disagrees with the SCM: $json" }
          }

          Invoke-Step "logs land under %PROGRAMDATA%" {
            if (-not (Test-Path $logDir)) { throw "no log directory at $logDir" }
            if (-not (Get-ChildItem $logDir -File)) { throw "the log directory at $logDir is empty" }
          }

          Invoke-Step "a killed process is restarted by the configured failure actions" {
            $pidBefore = ((& $bin service status --json | Out-String) | ConvertFrom-Json).pid
            & taskkill /F /PID $pidBefore | Out-Host
            $recovered = $false
            foreach ($i in 1..90) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $pidAfter = ((& $bin service status --json | Out-String) | ConvertFrom-Json).pid
                if ($pidAfter -and $pidAfter -ne $pidBefore) { $recovered = $true; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $recovered) { throw "the SCM did not restart the service after taskkill /F" }
          }

          Invoke-Step "stop settles before returning, and status agrees" {
            & $bin service stop
            if ($LASTEXITCODE -ne 0) { throw "stop exited $LASTEXITCODE" }
            & $bin service status | Out-Null
            if ($LASTEXITCODE -ne 3) { throw "a stopped service must report exit 3, got $LASTEXITCODE" }
          }

          Invoke-Step "restart brings it back" {
            & $bin service restart
            if ($LASTEXITCODE -ne 0) { throw "restart exited $LASTEXITCODE" }
            $ok = $false
            foreach ($i in 1..60) {
              & $bin service status | Out-Null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw "the service did not come back after restart" }
          }

          Invoke-Step "uninstall stops and deregisters" {
            & $bin service uninstall
            if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
            & $bin service status | Out-Null
            if ($LASTEXITCODE -ne 3) { throw "an absent service must report exit 3, got $LASTEXITCODE" }
          }

      # Unconditional: a persistent self-hosted runner must never be
      # left with a registered `all-smi` service or a stray config file,
      # whatever happened above.
      - name: Cleanup
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          $programData = [Environment]::GetFolderPath("CommonApplicationData")
          $appDir = Join-Path $programData "all-smi"
          & sc.exe stop all-smi 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          & sc.exe delete all-smi 2>&1 | Out-Null
          Remove-Item (Join-Path $appDir "config.toml") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir "logs") -Recurse -Force -ErrorAction SilentlyContinue
          $remaining = & sc.exe query all-smi 2>&1 | Out-String
          if ($remaining -notmatch "1060") {
            Write-Output "::warning::the all-smi service may still be registered on this runner: $remaining"
          }
          exit 0

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install AMD GPU development libraries
      - name: Install AMD GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libdrm-amdgpu1

      # protoc: cached install via composite action
      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: linux-x86_64

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binary
        run: cargo build --release --bin all-smi

      - name: Build library-only (no default features)
        run: cargo build --no-default-features --lib

      # Guards issue #345: with the `amd` feature off, `libamdgpu_top` must
      # not be linked, so the binary must not carry libdrm as a NEEDED entry.
      # `--no-default-features` also drops `cli` and therefore the binary, so
      # the comparable artifact is built with `cli` re-enabled. This step
      # overwrites target/release/all-smi from the step above; nothing later
      # in this job consumes that artifact.
      - name: Verify the AMD backend is droppable (no libdrm linkage)
        run: |
          cargo build --release --no-default-features --features cli --bin all-smi
          echo "NEEDED entries without the amd feature:"
          objdump -p target/release/all-smi | grep NEEDED || true
          if objdump -p target/release/all-smi | grep -q 'NEEDED.*libdrm'; then
            echo "::error::libdrm is still linked with --no-default-features --features cli"
            exit 1
          fi

      # The `Build binary` step above already compiles the Level Zero
      # backend, since `all_smi_level_zero` is unconditional on Linux. What
      # this adds is the `--locked` guarantee for the no-op feature:
      # `level_zero = []` activates no dependency, so passing it must not
      # move Cargo.lock. If it ever does, this fails here rather than in
      # the vendored Debian build, which uses the stricter `--frozen`.
      #
      # Like the step above, this overwrites target/release/all-smi.
      # Nothing in this job consumes that artifact.
      - name: The level_zero feature does not move Cargo.lock
        run: cargo build --release --locked --features level_zero --bin all-smi
